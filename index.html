<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicosis Music - Neon Cyberpunk</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #03000a; 
            overflow-x: hidden;
        }
        .animate-spin-slow {
            animation: spin 12s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .neon-glow-btn {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            transition: all 0.3s ease;
        }
        .neon-glow-btn:hover {
            box-shadow: 0 0 35px rgba(217, 70, 239, 0.8);
            transform: scale(1.05);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(3, 0, 10, 0.6);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(217, 70, 239, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            box-shadow: 0 0 10px #06b6d4;
        }
    </style>
</head>
<body class="bg-[#03000a] text-neutral-200">
    
    <script>
        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isInApp = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || 
                          (ua.indexOf("Instagram") > -1) || (ua.indexOf("TikTok") > -1) || 
                          (ua.indexOf("Twitter") > -1) || (ua.indexOf("Line") > -1) || 
                          (ua.indexOf("WhatsApp") > -1);

            if (isInApp) {
                var currentUrl = window.location.href;
                if (/Android/i.test(ua)) {
                    var cleanUrl = currentUrl.replace(/https?:\/\//, "");
                    window.location.href = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end";
                } else if (/iPhone|iPad|iPod/i.test(ua)) {
                    if (!currentUrl.includes("redirected=true")) {
                        var separator = currentUrl.includes("?") ? "&" : "?";
                        window.location.href = currentUrl + separator + "redirected=true";
                    }
                }
            }
        })();
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { createRoot } = ReactDOM;

        // Configuración de tu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
            authDomain: "psicosismusic-2b04a.firebaseapp.com",
            databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com/",
            projectId: "psicosismusic-2b04a",
            storageBucket: "psicosismusic-2b04a.firebasestorage.app",
            messagingSenderId: "233441166744",
            appId: "1:233441166744:web:6757b5fb8d4fd1803697ed"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Iconos SVG Integrados
        const PlayIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const PauseIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
        const SkipForwardIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>;
        const SkipBackIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="5" x2="5" y2="19"/></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const DownloadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;

        function App() {
            const [canciones, setCanciones] = useState([]);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            
            const [panelAbierto, setPanelAbierto] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [esAdmin, setEsAdmin] = useState(false);

            const [inputUrlArchive, setInputUrlArchive] = useState("");
            const [datosExtraidos, setDatosExtraidos] = useState(null);
            const [estadoInyector, setEstadoInyector] = useState("");
            const [descargandoMedia, setDescargandoMedia] = useState(false);

            const [busqueda, setBusqueda] = useState("");

            const audioRef = useRef(null);
            const caratulaPorDefecto = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500";

            // Escuchar cambios de Firebase
            useEffect(() => {
                const cancionesRef = db.ref('canciones');
                cancionesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const lista = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setCanciones(lista);
                    } else {
                        setCanciones([]);
                    }
                });
                return () => cancionesRef.off();
            }, []);

            // Control de cambios en pistas de reproducción
            useEffect(() => {
                if (audioRef.current) {
                    setProgress(0);
                    setDuration(0);

                    if (isPlaying && canciones.length > 0) {
                        audioRef.current.play().catch(() => setIsPlaying(false));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, currentTrackIndex, canciones]);

            const trackActual = canciones[currentTrackIndex] || {
                titulo: "Psicosis Music",
                artista: "Inyecta un enlace para empezar",
                mp3Url: "",
                portada: caratulaPorDefecto
            };

            const actualizarProgreso = () => {
                if (audioRef.current) setProgress(audioRef.current.currentTime);
            };

            const metadataCargada = () => {
                if (audioRef.current) setDuration(audioRef.current.duration);
            };

            const cambiarProgreso = (e) => {
                const nuevoTiempo = parseFloat(e.target.value);
                if (audioRef.current) {
                    audioRef.current.currentTime = nuevoTiempo;
                    setProgress(nuevoTiempo);
                }
            };

            const alternarReproduccion = () => {
                if (canciones.length > 0) setIsPlaying(!isPlaying);
            };

            const siguienteCancion = () => {
                if (canciones.length > 0) {
                    setCurrentTrackIndex((prev) => (prev + 1) % canciones.length);
                    setIsPlaying(true);
                }
            };

            const anteriorCancion = () => {
                if (canciones.length > 0) {
                    setCurrentTrackIndex((prev) => (prev - 1 + canciones.length) % canciones.length);
                    setIsPlaying(true);
                }
            };

            const verificarPassword = (e) => {
                e.preventDefault();
                if (passwordInput === "psicosis") {
                    setEsAdmin(true);
                    setPasswordInput("");
                } else {
                    alert("Contraseña Incorrecta");
                }
            };

            // DESCARGA ABSOLUTA CORREGIDA
            const descargarArchivoMp3 = (e, urlAncla, nombreTrack) => {
                e.preventDefault();
                if (!urlAncla) return;

                setDescargandoMedia(true);

                let urlDirecta = urlAncla.trim();
                if (!urlDirecta.startsWith('http://') && !urlDirecta.startsWith('https://')) {
                    urlDirecta = 'https://' + urlDirecta;
                }

                const linkDescarga = document.createElement('a');
                linkDescarga.href = urlDirecta;
                linkDescarga.target = "_blank"; 
                linkDescarga.setAttribute("download", `${nombreTrack}.mp3`);
                
                document.body.appendChild(linkDescarga);
                linkDescarga.click();
                document.body.removeChild(linkDescarga);

                setTimeout(() => {
                    setDescargandoMedia(false);
                }, 2000);
            };

            // INYECTOR DIRECTO SIN ERRORES DE VARIABLE
            const procesarEnlaceArchive = async () => {
                if (!inputUrlArchive.trim()) return;
                setEstadoInyector("Analizando enlace y extrayendo identificador...");
                setDatosExtraidos(null);

                let urlLimpiaMp3 = inputUrlArchive.trim();
                let portadaFinal = caratulaPorDefecto;
                let tituloDetectado = "Nueva Canción";
                let artistaDetectado = "Psicosis Music";

                try {
                    let parteItem = "";
                    
                    if (urlLimpiaMp3.includes("/items/")) {
                        parteItem = urlLimpiaMp3.split("/items/")[1].split("/")[0];
                    } else if (urlLimpiaMp3.includes("/details/")) {
                        parteItem = urlLimpiaMp3.split("/details/")[1].split("/")[0];
                    } else if (urlLimpiaMp3.includes("/download/")) {
                        parteItem = urlLimpiaMp3.split("/download/")[1].split("/")[0];
                    }

                    if (parteItem) {
                        portadaFinal = `https://archive.org/services/img/${parteItem}`;
                        urlLimpiaMp3 = `https://archive.org/download/${parteItem}/${parteItem}.mp3`;

                        try {
                            const apiRes = await fetch(`https://archive.org/metadata/${parteItem}`);
                            const apiData = await apiRes.json();
                            if (apiData.metadata) {
                                tituloDetectado = apiData.metadata.title || tituloDetectado;
                                artistaDetectado = apiData.metadata.creator || artistaDetectado;
                            }
                        } catch(apiErr) {
                            console.log("Metadata API omitida, usando fallback.");
                        }
                    }
                } catch (e) {
                    console.log("Error en el parser.");
                }

                if (tituloDetectado === "Nueva Canción") {
                    const decodificado = decodeURIComponent(urlLimpiaMp3);
                    let baseName = decodificado.substring(decodificado.lastIndexOf('/') + 1);
                    if (baseName.includes(".mp3")) {
                        baseName = baseName.split(".mp3")[0];
                    }
                    tituloDetectado = baseName.replaceAll("-", " ").replaceAll("_", " ");
                }

                setEstadoInyector("¡Enlace procesado correctamente!");
                setDatosExtraidos({
                    titulo: tituloDetectado,
                    artista: artistaDetectado,
                    portada: portadaFinal,
                    mp3Url: urlLimpiaMp3
                });
            };

            const aplicarYGuardarEnFirebase = () => {
                if (!datosExtraidos) return;

                db.ref('canciones').push(datosExtraidos, (error) => {
                    if (error) {
                        alert("Error al guardar en Firebase.");
                    } else {
                        alert("¡Guardado de forma automática en Firebase!");
                        setInputUrlArchive("");
                        setDatosExtraidos(null);
                        setEstadoInyector("");
                    }
                });
            };

            const eliminarCancion = (id) => {
                if (confirm("¿Eliminar canción de la playlist?")) {
                    db.ref(`canciones/${id}`).remove();
                    setCurrentTrackIndex(0);
                }
            };

            const cancionesFiltradas = canciones.filter(can => {
                const termino = busqueda.toLowerCase();
                return (
                    can.titulo.toLowerCase().includes(termino) || 
                    can.artista.toLowerCase().includes(termino)
                );
            });

            return (
                <div className="grid grid-cols-1 lg:grid-cols-[1fr_auto_1fr] min-h-screen w-full bg-[#03000a]">
                    
                    <audio 
                        ref={audioRef} 
                        src={trackActual.mp3Url} 
                        onTimeUpdate={actualizarProgreso} 
                        onLoadedMetadata={metadataCargada} 
                        onCanPlay={metadataCargada} 
                        onEnded={siguienteCancion}
                    />

                    {/* LADO IZQUIERDO DE DECORACIÓN */}
                    <div 
                        className="hidden lg:block bg-cover bg-center h-full w-full border-r border-cyan-500/10"
                        style={{ backgroundImage: "url('FONDO.jpg')" }}
                    ></div>

                    {/* REPRODUCTOR CENTRAL */}
                    <div className="flex items-center justify-center p-4 min-w-[360px] sm:min-w-[450px] bg-[#03000a] relative">
                        
                        <div className="w-full max-w-md bg-[#0c061f]/95 border border-cyan-500/30 rounded-3xl p-6 backdrop-blur-xl z-10 shadow-[0_0_50px_rgba(6,182,212,0.15)] relative">
                            
                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-xl font-black uppercase tracking-widest neon-text-cyan text-cyan-400">Psicosis Music</h1>
                                <button 
                                    onClick={() => setPanelAbierto(!panelAbierto)}
                                    className="px-3 py-1 text-xs font-bold border border-fuchsia-500 text-fuchsia-400 rounded-full hover:bg-fuchsia-500/20 transition"
                                >
                                    {panelAbierto ? "Ocultar Inyector" : "Modo Inyector"}
                                </button>
                            </div>

                            <div className="mb-4">
                                <input 
                                    type="text" 
                                    placeholder="🔍 Buscar canción o artista..." 
                                    value={busqueda}
                                    onChange={(e) => setBusqueda(e.target.value)}
                                    className="w-full bg-[#110a29] border border-cyan-500/30 text-xs rounded-xl p-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition shadow-[0_0_15px_rgba(6,182,212,0.05)]"
                                />
                            </div>

                            {panelAbierto && (
                                <div className="mb-6 p-4 bg-black/50 border border-fuchsia-500/40 rounded-2xl space-y-4">
                                    {!esAdmin ? (
                                        <form onSubmit={verificarPassword} className="space-y-2">
                                            <label className="text-xs font-bold text-fuchsia-400 uppercase tracking-wider block">Llave Secreta Admin:</label>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="password" placeholder="Contraseña..." value={passwordInput}
                                                    onChange={(e) => setPasswordInput(e.target.value)}
                                                    className="flex-1 bg-[#150d33] p-2 text-sm rounded border border-fuchsia-500/30 focus:outline-none text-white"
                                                />
                                                <button type="submit" className="px-4 py-2 bg-fuchsia-600 text-white font-bold text-xs rounded uppercase tracking-wider">Entrar</button>
                                            </div>
                                        </form>
                                    ) : (
                                        <div className="space-y-3">
                                            <h3 className="text-xs font-bold text-cyan-400 uppercase tracking-widest">Inyector de Carátula HD</h3>
                                            
                                            <div className="flex gap-2">
                                                <input 
                                                    type="url" placeholder="Pega el enlace de archive.org..." 
                                                    value={inputUrlArchive} onChange={(e) => setInputUrlArchive(e.target.value)}
                                                    className="flex-1 bg-[#150d33] p-2 text-xs rounded border border-cyan-500/20 focus:outline-none text-white"
                                                />
                                                <button 
                                                    onClick={procesarEnlaceArchive}
                                                    className="px-4 py-1 bg-cyan-600 hover:bg-cyan-500 text-black font-bold text-xs rounded uppercase"
                                                >
                                                    Extraer
                                                </button>
                                            </div>

                                            {estadoInyector && <p className="text-[11px] text-fuchsia-400 font-mono italic">{estadoInyector}</p>}

                                            {datosExtraidos && (
                                                <div className="p-2 bg-[#120a2b] border border-cyan-500/30 rounded space-y-2">
                                                    <div className="flex items-center gap-2">
                                                        <img src={datosExtraidos.portada} className="w-10 h-10 rounded object-cover border border-cyan-500/30" />
                                                        <div className="truncate flex-1">
                                                            <p className="text-xs font-bold text-white truncate">{datosExtraidos.titulo}</p>
                                                            <p className="text-[11px] text-gray-400 truncate">{datosExtraidos.artista}</p>
                                                        </div>
                                                    </div>
                                                    
                                                    <button 
                                                        onClick={aplicarYGuardarEnFirebase}
                                                        className="w-full py-2 bg-gradient-to-r from-green-500 to-cyan-500 text-black font-black text-xs uppercase rounded shadow-lg hover:opacity-90 transition"
                                                    >
                                                        💾 GUARDAR CAMBIOS EN FIREBASE
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="flex justify-center my-6">
                                <div className={`w-56 h-56 rounded-full border-4 border-cyan-400 p-1 shadow-[0_0_35px_rgba(6,182,212,0.3)] ${isPlaying ? 'animate-spin-slow' : ''}`}>
                                    <img 
                                        src={trackActual.portada || caratulaPorDefecto} alt="Carátula" 
                                        className="w-full h-full object-cover rounded-full select-none"
                                        onError={(e) => { e.target.src = caratulaPorDefecto; }}
                                    />
                                </div>
                            </div>

                            <div className="text-center mb-4">
                                <h2 className="text-xl font-bold tracking-wide text-white truncate px-2">{trackActual.titulo}</h2>
                                <p className="text-sm text-fuchsia-400 font-medium tracking-wide mt-0.5 truncate px-4">{trackActual.artista}</p>
                            </div>

                            {canciones.length > 0 && trackActual.mp3Url && (
                                <div className="flex flex-col items-center justify-center mb-5">
                                    <button 
                                        onClick={(e) => descargarArchivoMp3(e, trackActual.mp3Url, trackActual.titulo)}
                                        disabled={descargandoMedia}
                                        className={`flex items-center gap-2 px-4 py-1.5 border rounded-full text-xs font-medium transition ${descargandoMedia ? 'bg-fuchsia-950/40 border-fuchsia-500 text-fuchsia-400' : 'bg-neutral-900 hover:bg-neutral-800 border-neutral-700 text-neutral-300'}`}
                                    >
                                        <DownloadIcon />
                                        <span>{descargandoMedia ? "Abriendo descarga..." : "Descargar MP3 Original"}</span>
                                    </button>
                                </div>
                            )}

                            <div className="mb-6">
                                <input 
                                    type="range" min="0" max={duration || 0} value={progress} onChange={cambiarProgreso}
                                    className="w-full h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer text-cyan-400"
                                />
                                <div className="flex justify-between text-xs text-neutral-400 mt-2 font-mono">
                                    <span>{Math.floor(progress/60)}:{( "0" + Math.floor(progress%60) ).slice(-2)}</span>
                                    <span>{duration ? `${Math.floor(duration/60)}:${("0"+Math.floor(duration%60)).slice(-2)}` : "0:00"}</span>
                                </div>
                            </div>

                            <div className="flex justify-center items-center gap-6 mb-6">
                                <button onClick={anteriorCancion} className="text-cyan-400 p-2"><SkipBackIcon /></button>
                                <button onClick={alternarReproduccion} className="w-14 h-14 bg-cyan-500 text-black rounded-full flex items-center justify-center neon-glow-btn">
                                    {isPlaying ? <PauseIcon /> : <PlayIcon />}
                                </button>
                                <button onClick={siguienteCancion} className="text-cyan-400 p-2"><SkipForwardIcon /></button>
                            </div>

                            <div className="mt-4 border-t border-neutral-800/60 pt-4">
                                <div className="flex flex-col gap-2 mb-3">
                                    <h4 className="text-xs font-bold uppercase tracking-widest text-neutral-400">Playlist en la Nube ({cancionesFiltradas.length})</h4>
                                </div>

                                <div className="max-h-40 overflow-y-auto custom-scrollbar space-y-1">
                                    {cancionesFiltradas.length > 0 ? (
                                        cancionesFiltradas.map((can) => (
                                            <div 
                                                key={can.id} 
                                                className={`flex justify-between items-center p-2 rounded-xl text-xs cursor-pointer transition ${can.mp3Url === trackActual.mp3Url ? 'bg-cyan-500/10 text-cyan-300 border border-cyan-500/30' : 'text-neutral-300 hover:bg-neutral-900/40'}`}
                                                onClick={() => { 
                                                    const originalIndex = canciones.findIndex(c => c.id === can.id);
                                                    setCurrentTrackIndex(originalIndex); 
                                                    setIsPlaying(true); 
                                                }}
                                            >
                                                <div className="flex items-center gap-2.5 truncate flex-1">
                                                    <img 
                                                        src={can.portada || caratulaPorDefecto} 
                                                        alt="Miniatura" 
                                                        className="w-8 h-8 rounded-full object-cover border border-cyan-500/20 flex-shrink-0"
                                                        onError={(e) => { e.target.src = caratulaPorDefecto; }}
                                                    />
                                                    <div className="truncate">
                                                        <p className="font-bold truncate">{can.titulo}</p>
                                                        <p className="text-[10px] text-neutral-400 truncate">{can.artista}</p>
                                                    </div>
                                                </div>

                                                {esAdmin && (
                                                    <button onClick={(e) => { e.stopPropagation(); eliminarCancion(can.id); }} className="text-red-400 p-1 hover:scale-110 transition ml-2 flex-shrink-0">
                                                        <TrashIcon />
                                                    </button>
                                                )}
                                            </div>
                                        ))
                                    ) : (
                                        <p className="text-[11px] text-center text-gray-500 italic py-2">No se encontraron resultados</p>
                                    )}
                                </div>
                            </div>

                        </div>

                        {/* MARCA DE AGUA */}
                        <div className="absolute bottom-4 left-4 z-20 hidden sm:flex items-center gap-3 bg-[#0c061f]/80 border border-fuchsia-500/30 rounded-2xl p-2.5 backdrop-blur-md shadow-[0_0_20px_rgba(217,70,239,0.1)] transition-all hover:border-cyan-400/50">
                            <div className="w-10 h-10 rounded-xl overflow-hidden border border-fuchsia-400/40 shadow-[0_0_10px_rgba(217,70,239,0.2)]">
                                <img src="FONDO.jpg" alt="Creador" className="w-full h-full object-cover" />
                            </div>
                            <div className="flex flex-col">
                                <span className="text-[10px] font-black uppercase tracking-wider text-fuchsia-400">Desarrollado por</span>
                                <span className="text-xs font-bold text-white tracking-wide">Psicosis Music Team</span>
                            </div>
                        </div>

                    </div>

                    {/* LADO DERECHO DE DECORACIÓN */}
                    <div 
                        className="hidden lg:block bg-cover bg-center h-full w-full border-l border-cyan-500/10"
