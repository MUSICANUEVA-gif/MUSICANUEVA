
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psicosis Music Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
background:#060010;
color:white;
min-height:100vh;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#9d00ff55,transparent 30%),
radial-gradient(circle at bottom right,#00e5ff33,transparent 30%),
linear-gradient(to bottom,#05000d,#120020);
z-index:-1;
}

.container{
display:grid;
grid-template-columns:260px 1fr 340px;
gap:20px;
padding:20px;
min-height:100vh;
}

.sidebar,.center,.player{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:30px;
}

.sidebar{padding:25px}

.logo{
font-size:2.3rem;
font-weight:700;
cursor:pointer;
margin-bottom:35px;
line-height:1.1;
}

.logo span{color:#bb4dff}

.menu div{
padding:15px;
margin-bottom:12px;
background:rgba(255,255,255,.04);
border-radius:16px;
}

.center{
padding:20px;
}

.hero{
height:250px;
border-radius:30px;
padding:35px;
display:flex;
flex-direction:column;
justify-content:flex-end;
background:
linear-gradient(to right,#000000bb,#00000055),
url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1400&auto=format&fit=crop');
background-size:cover;
background-position:center;
margin-bottom:25px;
}

.hero h1{
font-size:4rem;
}

.search{
margin-top:20px;
padding:16px;
border:none;
border-radius:20px;
background:rgba(255,255,255,.12);
color:white;
outline:none;
max-width:400px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:25px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 25px #962eff55;
}

.card img{
width:100%;
height:210px;
object-fit:cover;
}

.card-info{
padding:15px;
}

.card-info h3{
margin-bottom:5px;
}

.card-info p{
opacity:.7;
margin-bottom:12px;
}

.adminDelete{
width:100%;
padding:10px;
border:none;
border-radius:12px;
background:#ff2f68;
color:white;
font-weight:700;
cursor:pointer;
display:none;
}

.player{
padding:25px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.player img{
width:240px;
height:240px;
border-radius:30px;
object-fit:cover;
margin-bottom:20px;
box-shadow:0 0 35px #962eff66;
}

.playBtn{
width:85px;
height:85px;
border-radius:50%;
border:none;
background:#962eff;
color:white;
font-size:2rem;
cursor:pointer;
margin:15px 0;
}

audio{
width:100%;
}

.download{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:linear-gradient(to right,#7b00ff,#c14dff);
color:white;
font-weight:700;
cursor:pointer;
margin-top:20px;
}

#injector{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:95%;
max-width:450px;
background:#120021;
border:1px solid #962eff66;
padding:25px;
border-radius:30px;
display:none;
z-index:9999;
box-shadow:0 0 40px #962eff55;
}

#injector input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:15px;
background:#1f1030;
color:white;
outline:none;
}

#injector button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#962eff;
color:white;
font-weight:700;
cursor:pointer;
margin-top:10px;
}

.hidden{display:none}

@media(max-width:1100px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<div class="logo" id="logo">
PSICOSIS<br>
<span>MUSIC</span>
</div>

<div class="menu">
<div>🏠 Inicio</div>
<div>🔥 Tendencias</div>
<div>🎵 Playlist</div>
<div>❤️ Favoritos</div>
<div>⬇ Descargas</div>
</div>

</div>

<div class="center">

<div class="hero">
<h1>Psicosis Music</h1>
<input class="search" id="search" placeholder="Buscar canción o artista">
</div>

<div class="grid" id="songs"></div>

</div>

<div class="player">

<img id="cover" src="https://picsum.photos/500">

<h2 id="title">Selecciona una canción</h2>

<p id="artist">Psicosis Music</p>

<button class="playBtn" id="playBtn">▶</button>

<audio id="audio" controls></audio>

<button class="download" id="downloadBtn">
⬇ Descargar MP3
</button>

</div>

</div>

<div id="injector">

<h2 style="text-align:center;margin-bottom:20px;">
INYECTOR PSICOSIS
</h2>

<div id="loginBox">

<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">

<button onclick="login()">
ENTRAR
</button>

</div>

<div id="adminPanel" class="hidden">

<input id="mp3" placeholder="URL MP3 DIRECTO">
<input id="coverInput" placeholder="URL PORTADA">

<button onclick="injectSong()">
INYECTAR Y GUARDAR
</button>

</div>

<button onclick="closeInjector()">
CERRAR
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
authDomain: "psicosismusic-2b04a.firebaseapp.com",
databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com",
projectId: "psicosismusic-2b04a",
storageBucket: "psicosismusic-2b04a.firebasestorage.app",
messagingSenderId: "233441166744",
appId: "1:233441166744:web:6757b5fb8d4fd1803697ed",
measurementId: "G-Q5T61C2MNE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const songsDiv = document.getElementById("songs");
const audio = document.getElementById("audio");
const cover = document.getElementById("cover");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const playBtn = document.getElementById("playBtn");
const downloadBtn = document.getElementById("downloadBtn");

let currentSong = null;
let isAdmin = false;

function renderSongs(data){

songsDiv.innerHTML = "";

Object.entries(data || {}).reverse().forEach(([id,song])=>{

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<img src="${song.cover}">
<div class="card-info">
<h3>${song.title}</h3>
<p>${song.artist}</p>
<button class="adminDelete">🗑 Eliminar</button>
</div>
`;

card.onclick = ()=>playSong(song);

const delBtn = card.querySelector(".adminDelete");

if(isAdmin){
delBtn.style.display = "block";
}

delBtn.onclick = (e)=>{
e.stopPropagation();

if(confirm("¿Eliminar canción?")){

remove(ref(db,"songs/" + id));

}

};

songsDiv.appendChild(card);

});

}

function playSong(song){

currentSong = song;

audio.crossOrigin = "anonymous";

audio.src = song.mp3;

audio.load();

cover.src = song.cover;

title.innerText = song.title;

artist.innerText = song.artist;

audio.oncanplaythrough = ()=>{

audio.play();

playBtn.innerText = "⏸";

};

}

playBtn.onclick = ()=>{

if(audio.paused){

audio.play();
playBtn.innerText = "⏸";

}else{

audio.pause();
playBtn.innerText = "▶";

}

};

downloadBtn.onclick = ()=>{

if(!currentSong) return;

const iframe = document.createElement("iframe");

iframe.style.display = "none";

iframe.src = currentSong.mp3;

document.body.appendChild(iframe);

setTimeout(()=>{
iframe.remove();
},15000);

};

onValue(ref(db,"songs"),(snapshot)=>{

renderSongs(snapshot.val());

});

window.login = function(){

const u = document.getElementById("user").value;
const p = document.getElementById("pass").value;

if(u === "admin" && p === "psicosis123"){

isAdmin = true;

document.getElementById("adminPanel").classList.remove("hidden");

alert("Modo administrador activado");

onValue(ref(db,"songs"),(snapshot)=>{
renderSongs(snapshot.val());
});

}else{

alert("Datos incorrectos");

}

};

window.injectSong = function(){

const mp3 = document.getElementById("mp3").value.trim();
const coverUrl = document.getElementById("coverInput").value.trim();

if(!mp3 || !coverUrl){

alert("Completa todos los campos");

return;

}

let songData = {
title:"Sin título",
artist:"Artista desconocido",
mp3:mp3,
cover:coverUrl
};

new window.jsmediatags.Reader(mp3)
.read({
onSuccess:function(tag){

songData.title = tag.tags.title || "Sin título";
songData.artist = tag.tags.artist || "Artista desconocido";

push(ref(db,"songs"),songData);

alert("Canción guardada");

},
onError:function(){

push(ref(db,"songs"),songData);

alert("Guardada sin metadata");

}
});

};

window.closeInjector = function(){

document.getElementById("injector").style.display = "none";

};

let clicks = 0;

document.getElementById("logo").addEventListener("click",()=>{

clicks++;

if(clicks >= 3){

document.getElementById("injector").style.display = "block";

clicks = 0;

}

setTimeout(()=>{
clicks = 0;
},1500);

});

</script>

</body>
</html>
