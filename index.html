<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psicosis Music</title>
<style>
body{
margin:0;
font-family:Arial;
background:#0b0017;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}
.sidebar{
width:240px;
background:#1a0430;
padding:20px;
}
.logo{
font-size:48px;
font-weight:bold;
line-height:1;
color:#b94dff;
cursor:pointer;
}
.main{
flex:1;
padding:20px;
overflow:auto;
}
.hero{
height:220px;
border-radius:20px;
background:url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop') center/cover;
display:flex;
align-items:center;
padding:40px;
font-size:60px;
font-weight:bold;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}
.card{
background:#1c102d;
border-radius:20px;
overflow:hidden;
padding-bottom:15px;
}
.card img{
width:100%;
height:220px;
object-fit:cover;
}
.card h3{
margin:10px;
}
.player{
width:320px;
background:#0d2137;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
}
.player img{
width:220px;
height:220px;
object-fit:cover;
border-radius:20px;
}
.btn{
background:#a020f0;
color:white;
border:none;
padding:14px 24px;
border-radius:14px;
cursor:pointer;
margin-top:15px;
}
input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
background:#140324;
color:white;
}
#injector{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
}
.box{
width:420px;
background:#12001f;
padding:25px;
border-radius:20px;
}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo" id="logoAdmin">PSICOSIS<br>MUSIC</div>
</div>

<div class="main">
<div class="hero">Psicosis Music</div>

<div class="grid" id="songs"></div>
</div>

<div class="player">
<img id="cover" src="https://via.placeholder.com/300">
<h2 id="title">Selecciona una canción</h2>
<p id="artist">Psicosis Music</p>
<audio id="audio" controls style="width:100%"></audio>
<button class="btn" onclick="downloadSong()">↓ Descargar MP3</button>
<button class="btn" id="deleteBtn" style="display:none;background:#ff1744" onclick="deleteSong()">Eliminar</button>
</div>

<div id="injector">
<div class="box">
<h2>INYECTOR PSICOSIS</h2>

<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">

<button class="btn" style="width:100%" onclick="login()">ENTRAR</button>

<div id="adminPanel" style="display:none">
<input id="mp3" placeholder="Link MP3">
<input id="coverInput" placeholder="Link Carátula">
<input id="titleInput" placeholder="Título">
<input id="artistInput" placeholder="Artista">

<button class="btn" style="width:100%" onclick="injectSong()">INYECTAR Y GUARDAR</button>
</div>

<button class="btn" style="width:100%;background:#333" onclick="closeInjector()">Cerrar</button>
</div>
</div>

<script>
let admin=false;
let songs=[];
let currentIndex=null;

const audio=document.getElementById("audio");

function renderSongs(){
const container=document.getElementById("songs");
container.innerHTML="";

songs.forEach((s,index)=>{
const div=document.createElement("div");
div.className="card";
div.innerHTML=`
<img src="${s.cover}">
<h3>${s.title}</h3>
<p style="margin:10px">${s.artist}</p>
`;
div.onclick=()=>playSong(index);
container.appendChild(div);
});
}

function playSong(index){
currentIndex=index;
const s=songs[index];
document.getElementById("cover").src=s.cover;
document.getElementById("title").innerText=s.title;
document.getElementById("artist").innerText=s.artist;
audio.src=s.mp3;
audio.play();

document.getElementById("deleteBtn").style.display=admin?"block":"none";
}

async function downloadSong(){
if(currentIndex===null)return;

const s=songs[currentIndex];

try{
const response=await fetch(s.mp3);
const blob=await response.blob();

const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download=s.title+".mp3";
document.body.appendChild(a);
a.click();

URL.revokeObjectURL(url);

}catch(e){
alert("No se pudo descargar");
}
}

function deleteSong(){
if(currentIndex===null)return;

songs.splice(currentIndex,1);
localStorage.setItem("psicosisSongs",JSON.stringify(songs));

renderSongs();

document.getElementById("cover").src="https://via.placeholder.com/300";
document.getElementById("title").innerText="Selecciona una canción";
document.getElementById("artist").innerText="Psicosis Music";
audio.src="";
}

let clicks=0;

document.getElementById("logoAdmin").onclick=()=>{
clicks++;
if(clicks>=3){
document.getElementById("injector").style.display="flex";
clicks=0;
}
}

function closeInjector(){
document.getElementById("injector").style.display="none";
}

function login(){
const u=document.getElementById("user").value;
const p=document.getElementById("pass").value;

if(u==="admin" && p==="psicosis123"){
admin=true;
document.getElementById("adminPanel").style.display="block";
alert("Modo administrador activado");
}else{
alert("Credenciales incorrectas");
}
}

function injectSong(){
const song={
mp3:document.getElementById("mp3").value,
cover:document.getElementById("coverInput").value,
title:document.getElementById("titleInput").value,
artist:document.getElementById("artistInput").value
};

songs.push(song);

localStorage.setItem("psicosisSongs",JSON.stringify(songs));

renderSongs();

alert("Canción guardada correctamente");
}

const saved=localStorage.getItem("psicosisSongs");
if(saved){
songs=JSON.parse(saved);
renderSongs();
}
</script>

</body>
</html>
