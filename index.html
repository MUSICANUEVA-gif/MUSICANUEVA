<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSICOSIS MUSIC | Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --bg-black: #050505;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        /* Efectos de Brillo Neón */
        .neon-border {
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
            transition: all 0.3s ease;
        }
        .neon-border:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .neon-text-cyan { text-shadow: 0 0 10px var(--neon-cyan); }
        .neon-text-magenta { text-shadow: 0 0 10px var(--neon-magenta); }

        /* Estilo del buscador tipo YouTube */
        .search-container {
            background: #121212;
            border: 1px solid #333;
            border-radius: 99px;
            transition: 0.3s;
        }
        .search-container:focus-within {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        /* Barra de progreso interactiva */
        #progress-container {
            cursor: pointer;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            position: relative;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
            border-radius: 3px;
            width: 0%;
        }

        /* Scrollbar Personalizado */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

        .genre-btn.active {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--neon-cyan);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-32">

    <header class="fixed top-0 left-0 right-0 z-50 bg-black/95 border-b border-white/10 backdrop-blur-lg">
        <div class="max-w-[1600px] mx-auto px-4 h-16 flex items-center justify-between gap-4">
            
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center">
                    <i data-lucide="zap" class="text-white w-6 h-6 fill-current"></i>
                </div>
                <h1 class="text-xl font-orbitron font-black tracking-tighter hidden sm:block">
                    PSICOSIS <span class="text-cyan-400">MUSIC</span>
                </h1>
            </div>

            <div class="flex-1 max-w-2xl">
                <form id="search-form" class="search-container flex items-center px-4 py-2">
                    <input type="text" id="search-input" 
                           placeholder="Busca artistas, canciones o álbumes (ej: Karol G, Corazón Serrano...)" 
                           class="bg-transparent w-full outline-none text-sm text-gray-200">
                    <button type="submit" class="ml-2 text-gray-400 hover:text-cyan-400 transition">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </button>
                </form>
            </div>

            <div class="hidden md:flex items-center gap-4">
                <span class="text-[10px] font-bold text-cyan-400 border border-cyan-400/30 px-3 py-1 rounded-full animate-pulse">
                    EN VIVO: TENDENCIAS 2027
                </span>
            </div>
        </div>
    </header>

    <main class="pt-24 px-4 max-w-[1600px] mx-auto">
        
        <div id="genres-bar" class="flex gap-3 mb-8 overflow-x-auto pb-4 no-scrollbar">
            <button onclick="searchMusic('Todo')" class="genre-btn active px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border border-white/10">Todo</button>
            <button onclick="searchMusic('Cumbia')" class="genre-btn px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border border-white/10 bg-white/5 hover:bg-white/10">Cumbia</button>
            <button onclick="searchMusic('Salsa')" class="genre-btn px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border border-white/10 bg-white/5 hover:bg-white/10">Salsa</button>
            <button onclick="searchMusic('Reggaeton')" class="genre-btn px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border border-white/10 bg-white/5 hover:bg-white/10">Reggaeton</button>
            <button onclick="searchMusic('Merengue')" class="genre-btn px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border border-white/10 bg-white/5 hover:bg-white/10">Merengue</button>
            <button onclick="searchMusic('Bachata')" class="genre-btn px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border border-white/10 bg-white/5 hover:bg-white/10">Bachata</button>
            <button onclick="searchMusic('Techno Rock')" class="genre-btn px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border border-white/10 bg-white/5 hover:bg-white/10">Techno Rock</button>
            <button onclick="searchMusic('Baladas')" class="genre-btn px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border border-white/10 bg-white/5 hover:bg-white/10">Baladas</button>
        </div>

        <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
            <!-- Los resultados reales aparecerán aquí -->
            <div class="col-span-full flex flex-col items-center py-20 opacity-50">
                <div class="loading-spinner mb-4"></div>
                <p class="font-bold tracking-widest text-cyan-400">CARGANDO MÚSICA REAL...</p>
            </div>
        </div>
    </main>

    <footer id="player" class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-cyan-500/30 backdrop-blur-xl p-4 z-[100] translate-y-full transition-transform duration-500">
        <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row items-center gap-6">
            
            <!-- Info -->
            <div class="flex items-center gap-4 w-full md:w-1/4">
                <img id="player-cover" src="" class="w-14 h-14 rounded-lg object-cover shadow-lg border border-white/10" alt="">
                <div class="overflow-hidden">
                    <h4 id="player-title" class="font-black text-sm truncate uppercase tracking-tighter">Canción</h4>
                    <p id="player-artist" class="text-xs text-cyan-400 font-bold truncate">Artista</p>
                </div>
            </div>

            <!-- Controles Centrales -->
            <div class="flex-1 w-full flex flex-col items-center">
                <div class="flex items-center gap-6 mb-3">
                    <button onclick="skipTime(-10)" class="text-gray-400 hover:text-white transition"><i data-lucide="rewind" class="w-5 h-5"></i></button>
                    <button id="play-btn" onclick="togglePlay()" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-110 transition shadow-xl">
                        <i data-lucide="play" class="fill-current w-6 h-6 ml-1"></i>
                    </button>
                    <button onclick="skipTime(10)" class="text-gray-400 hover:text-white transition"><i data-lucide="fast-forward" class="w-5 h-5"></i></button>
                </div>

                <div class="w-full flex items-center gap-3">
                    <span id="time-current" class="text-[10px] font-mono text-gray-500">0:00</span>
                    <div id="progress-container" onclick="seek(event)" class="flex-1">
                        <div id="progress-bar"></div>
                    </div>
                    <span id="time-total" class="text-[10px] font-mono text-gray-500">0:30</span>
                </div>
            </div>

            <!-- Botón Descarga -->
            <div class="w-full md:w-1/4 flex justify-end">
                <button id="download-btn" class="w-full md:w-auto bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black px-8 py-3 rounded-xl flex items-center justify-center gap-3 transition-all shadow-lg shadow-cyan-500/20 group">
                    <i data-lucide="download" class="w-5 h-5 group-hover:bounce"></i>
                    DESCARGAR (320K)
                </button>
            </div>
        </div>
    </footer registrar>

    <audio id="audio-engine"></audio>

    <script>
        const audio = document.getElementById('audio-engine');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const grid = document.getElementById('results-grid');
        
        let currentTrackData = null;

        // Función para buscar música real usando la API de iTunes (Gratuita y sin límites)
        async function searchMusic(query) {
            const term = query === 'Todo' ? 'exitos latino 2027' : query;
            grid.innerHTML = `
                <div class="col-span-full flex flex-col items-center py-20">
                    <div class="loading-spinner mb-4"></div>
                    <p class="font-bold tracking-widest text-cyan-400 animate-pulse">BUSCANDO EN TODA LATINOAMÉRICA...</p>
                </div>
            `;

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&limit=20&country=US`);
                const data = await response.json();
                renderResults(data.results);
            } catch (error) {
                grid.innerHTML = `<div class="col-span-full text-center text-red-500 font-bold">Error de conexión. Inténtalo de nuevo.</div>`;
            }
        }

        function renderResults(songs) {
            if (songs.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-500">No se encontraron resultados para esta búsqueda.</div>`;
                return;
            }

            grid.innerHTML = songs.map(song => {
                // Mejoramos la resolución de la carátula
                const cover = song.artworkUrl100.replace('100x100bb', '600x600bb');
                return `
                    <div class="neon-border bg-zinc-900/50 rounded-2xl overflow-hidden group cursor-pointer transition-all" onclick="playSong('${song.previewUrl}', '${song.trackName}', '${song.artistName}', '${cover}')">
                        <div class="relative aspect-square overflow-hidden">
                            <img src="${cover}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="${song.trackName}">
                            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition">
                                <div class="w-16 h-16 bg-cyan-500 text-black rounded-full flex items-center justify-center shadow-2xl">
                                    <i data-lucide="play" class="fill-current w-8 h-8 ml-1"></i>
                                </div>
                            </div>
                            <div class="absolute top-2 left-2 bg-black/80 backdrop-blur-md px-2 py-1 rounded text-[9px] font-black text-cyan-400 border border-cyan-500/30">ORIGINAL</div>
                        </div>
                        <div class="p-4">
                            <h3 class="font-black text-sm text-white truncate uppercase tracking-tighter">${song.trackName}</h3>
                            <p class="text-xs text-cyan-500 font-bold mt-1 truncate">${song.artistName}</p>
                            <div class="flex items-center justify-between mt-4">
                                <span class="text-[10px] text-gray-500 font-bold">${song.primaryGenreName}</span>
                                <button onclick="event.stopPropagation(); downloadDirect('${song.previewUrl}', '${song.trackName}')" 
                                        class="bg-white/5 hover:bg-cyan-500/20 p-2 rounded-lg transition-colors border border-white/5">
                                    <i data-lucide="download" class="w-4 h-4 text-cyan-400"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function playSong(url, title, artist, cover) {
            currentTrackData = { url, title, artist };
            
            document.getElementById('player-title').innerText = title;
            document.getElementById('player-artist').innerText = artist;
            document.getElementById('player-cover').src = cover;
            document.getElementById('player').classList.remove('translate-y-full');

            audio.src = url;
            audio.play();
            updatePlayIcon(true);
            
            document.getElementById('download-btn').onclick = () => downloadDirect(url, title);
        }

        function togglePlay() {
            if (audio.paused) audio.play(); else audio.pause();
            updatePlayIcon(!audio.paused);
        }

        function updatePlayIcon(isPlaying) {
            const btn = document.getElementById('play-btn');
            btn.innerHTML = isPlaying ? '<i data-lucide="pause" class="fill-current w-6 h-6"></i>' : '<i data-lucide="play" class="fill-current w-6 h-6 ml-1"></i>';
            lucide.createIcons();
        }

        function skipTime(amount) {
            audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + amount));
        }

        function seek(e) {
            const container = document.getElementById('progress-container');
            const rect = container.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }

        // Actualización de barra de progreso
        audio.ontimeupdate = () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;
            
            const curMin = Math.floor(audio.currentTime / 60);
            const curSec = Math.floor(audio.currentTime % 60);
            document.getElementById('time-current').innerText = `${curMin}:${curSec.toString().padStart(2, '0')}`;
            
            if (!isNaN(audio.duration)) {
                const totMin = Math.floor(audio.duration / 60);
                const totSec = Math.floor(audio.duration % 60);
                document.getElementById('time-total').innerText = `${totMin}:${totSec.toString().padStart(2, '0')}`;
            }
        };

        // Descarga Directa Real
        function downloadDirect(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = `PSICOSIS_MUSIC_${filename.replace(/\s/g, '_')}_320kbps.mp3`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Manejo del formulario de búsqueda
        searchForm.onsubmit = (e) => {
            e.preventDefault();
            if (searchInput.value.trim()) {
                searchMusic(searchInput.value);
            }
        };

        // Cambiar estilos de botones de género
        document.querySelectorAll('.genre-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active', 'bg-white/5'));
                this.classList.add('active');
            });
        });

        // Carga inicial
        window.onload = () => {
            lucide.createIcons();
            searchMusic('Todo');
        };
    </script>
</body>
</html>
