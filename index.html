<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicosis Music - Neon Cyberpunk</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #03000a; 
        }
        .animate-spin-slow {
            animation: spin 12s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .neon-glow-btn {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            transition: all 0.3s ease;
        }
        .neon-glow-btn:hover {
            box-shadow: 0 0 35px rgba(217, 70, 239, 0.8);
            transform: scale(1.05);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(3, 0, 10, 0.6);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(217, 70, 239, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            box-shadow: 0 0 10px #06b6d4;
        }
    </style>
</head>
<body class="bg-[#03000a] text-neutral-200">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { createRoot } = ReactDOM;

        // --- CONFIGURACIÓN DE TU BASE DE DATOS FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
            authDomain: "psicosismusic-2b04a.firebaseapp.com",
            databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com/",
            projectId: "psicosismusic-2b04a",
            storageBucket: "psicosismusic-2b04a.firebasestorage.app",
            messagingSenderId: "233441166744",
            appId: "1:233441166744:web:6757b5fb8d4fd1803697ed"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- ICONOS ---
        const PlayIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const PauseIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
        const SkipForwardIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>;
        const SkipBackIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="5" x2="5" y2="19"/></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const DownloadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;

        function App() {
            const [canciones, setCanciones] = useState([]);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            
            const [panelAbierto, setPanelAbierto] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [esAdmin, setEsAdmin] = useState(false);

            const [inputUrlArchive, setInputUrlArchive] = useState("");
            const [datosExtraidos, setDatosExtraidos] = useState(null);
            const [estadoInyector, setEstadoInyector] = useState("");
            const [descargandoMedia, setDescargandoMedia] = useState(false);

            const audioRef = useRef(null);

            useEffect(() => {
                const cancionesRef = db.ref('canciones');
                cancionesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const lista = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setCanciones(lista);
                    } else {
                        setCanciones([]);
                    }
                });
                return () => cancionesRef.off();
            }, []);

            useEffect(() => {
                if (audioRef.current) {
                    if (isPlaying && canciones.length > 0) {
                        audioRef.current.play().catch(() => setIsPlaying(false));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, currentTrackIndex, canciones]);

            const trackActual = canciones[currentTrackIndex] || {
                titulo: "Psicosis Music",
                artista: "Inyecta un enlace para empezar",
                mp3Url: "",
                portadaUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500"
            };

            const actualizarProgreso = () => {
                if (audioRef.current) setProgress(audioRef.current.currentTime);
            };

            const metadataCargada = () => {
                if (audioRef.current) setDuration(audioRef.current.duration);
            };

            const cambiarProgreso = (e) => {
                const nuevoTiempo = parseFloat(e.target.value);
                if (audioRef.current) {
                    audioRef.current.currentTime = nuevoTiempo;
                    setProgress(nuevoTiempo);
                }
            };

            const alternarReproduccion = () => {
                if (canciones.length > 0) setIsPlaying(!isPlaying);
            };

            const siguienteCancion = () => {
                if (canciones.length > 0) {
                    setCurrentTrackIndex((prev) => (prev + 1) % canciones.length);
                    setIsPlaying(true);
                }
            };

            const anteriorCancion = () => {
                if (canciones.length > 0) {
                    setCurrentTrackIndex((prev) => (prev - 1 + canciones.length) % canciones.length);
                    setIsPlaying(true);
                }
            };

            const verificarPassword = (e) => {
                e.preventDefault();
                if (passwordInput === "psicosis") {
                    setEsAdmin(true);
                    setPasswordInput("");
                } else {
                    alert("Contraseña Incorrecta");
                }
            };

            // DETALLE 1 CORREGIDO: FUNCIÓN DE DESCARGA DIRECTA REAL SIN ABRIR OTRA PESTAÑA
            const descargarArchivoMp3 = async (e, urlAncla, nombreTrack) => {
                e.preventDefault();
                if (!urlAncla || descargandoMedia) return;

                setDescargandoMedia(true);
                try {
                    const respuesta = await fetch(urlAncla);
                    const blob = await respuesta.blob();
                    const urlBlob = window.URL.createObjectURL(blob);
                    
                    const enlaceDescarga = document.createElement('a');
                    enlaceDescarga.href = urlBlob;
                    enlaceDescarga.download = `${nombreTrack}.mp3`;
                    document.body.appendChild(enlaceDescarga);
                    enlaceDescarga.click();
                    
                    document.body.removeChild(enlaceDescarga);
                    window.URL.revokeObjectURL(urlBlob);
                } catch (error) {
                    // Fallback directo seguro si hay bloqueos extremos del navegador
                    window.location.href = urlAncla;
                } finally {
                    setDescargandoMedia(false);
                }
            };

            // DETALLE 2 CORREGIDO: INYECTOR INTELIGENTE CON EXTRACCIÓN MEJORADA DE CARÁTULA
            const procesarEnlaceArchive = async () => {
                if (!inputUrlArchive.trim()) return;
                setEstadoInyector("Descargando fragmento de 2.5 MB para metadatos...");
                setDatosExtraidos(null);

                // Generar carátula inteligente alternativa basada en el directorio de Archive.org
                let portadaAlternativa = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500";
                try {
                    if (inputUrlArchive.includes("/items/")) {
                        const parteItem = inputUrlArchive.split("/items/")[1].split("/")[0];
                        // Apunta al archivo de carátula pre-generado que Archive crea automáticamente para sus álbumes
                        portadaAlternativa = `https://archive.org/services/img/${parteItem}`;
                    }
                } catch(e){}

                try {
                    const respuesta = await fetch(inputUrlArchive, {
                        headers: { 'Range': 'bytes=0-2500000' }
                    });
                    const blob = await respuesta.blob();
                    setEstadoInyector("Extrayendo foto de perfil incrustada e información...");

                    jsmediatags.read(blob, {
                        onSuccess: function(tag) {
                            let titulo = tag.tags.title || "Canción Nueva";
                            let artista = tag.tags.artist || "Psicosis Music";
                            let portada = portadaAlternativa;

                            const image = tag.tags.picture;
                            if (image) {
                                let base64String = "";
                                for (let i = 0; i < image.data.length; i++) {
                                    base64String += String.fromCharCode(image.data[i]);
                                }
                                portada = "data:" + image.format + ";base64," + window.btoa(base64String);
                                setEstadoInyector("¡Carátula interna del archivo MP3 leída!");
                            } else {
                                setEstadoInyector("¡Carátula del álbum enlazada automáticamente!");
                            }

                            setDatosExtraidos({ titulo, artista, portada, mp3Url: inputUrlArchive });
                        },
                        onError: function() {
                            setEstadoInyector("Metadatos inteligentes aplicados con éxito.");
                            const decodificado = decodeURIComponent(inputUrlArchive);
                            const nombreArchivo = decodificado.substring(decodificado.lastIndexOf('/') + 1).replace(".mp3", "");
                            
                            setDatosExtraidos({
                                titulo: nombreArchivo,
                                artista: "Psicosis Music",
                                portada: portadaAlternativa,
                                mp3Url: inputUrlArchive
                            });
                        }
                    });
                } catch (err) {
                    setEstadoInyector("Listo para guardar cambios.");
                    const decodificado = decodeURIComponent(inputUrlArchive);
                    const nombreArchivo = decodificado.substring(decodificado.lastIndexOf('/') + 1).replace(".mp3", "");
                    setDatosExtraidos({
                        titulo: nombreArchivo,
                        artista: "Psicosis Music",
                        portada: portadaAlternativa,
                        mp3Url: inputUrlArchive
                    });
                }
            };

            const aplicarYGuardarEnFirebase = () => {
                if (!datosExtraidos) return;

                db.ref('canciones').push(datosExtraidos, (error) => {
                    if (error) {
                        alert("Error al sincronizar.");
                    } else {
                        alert("¡Guardado de forma automática! Los cambios están listos y publicados.");
                        setInputUrlArchive("");
                        setDatosExtraidos(null);
                        setEstadoInyector("");
                    }
                });
            };

            const eliminarCancion = (id) => {
                if (confirm("¿Eliminar canción de la playlist?")) {
                    db.ref(`canciones/${id}`).remove();
                    setCurrentTrackIndex(0);
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-[#05010e] relative overflow-hidden">
                    
                    <audio 
                        ref={audioRef} src={trackActual.mp3Url} 
                        onTimeUpdate={actualizarProgreso} onLoadedMetadata={metadataCargada} onEnded={siguienteCancion}
                    />

                    <div className="w-full max-w-md bg-[#0c061f]/90 border border-cyan-500/30 rounded-3xl p-6 backdrop-blur-xl z-10 shadow-[0_0_50px_rgba(6,182,212,0.15)] relative">
                        
                        {/* Cabecera */}
                        <div className="flex justify-between items-center mb-6">
                            <h1 className="text-xl font-black uppercase tracking-widest neon-text-cyan text-cyan-400">Psicosis Music</h1>
                            <button 
                                onClick={() => setPanelAbierto(!panelAbierto)}
                                className="px-3 py-1 text-xs font-bold border border-fuchsia-500 text-fuchsia-400 rounded-full hover:bg-fuchsia-500/20 transition"
                            >
                                {panelAbierto ? "Ocultar Inyector" : "Modo Inyector"}
                            </button>
                        </div>

                        {/* PANEL INYECTOR CON BOTÓN DE GUARDAR CAMBIOS */}
                        {panelAbierto && (
                            <div className="mb-6 p-4 bg-black/50 border border-fuchsia-500/40 rounded-2xl space-y-4">
                                {!esAdmin ? (
                                    <form onSubmit={verificarPassword} className="space-y-2">
                                        <label className="text-xs font-bold text-fuchsia-400 uppercase tracking-wider block">Llave Secreta Admin:</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="password" placeholder="Contraseña..." value={passwordInput}
                                                onChange={(e) => setPasswordInput(e.target.value)}
                                                className="flex-1 bg-[#150d33] p-2 text-sm rounded border border-fuchsia-500/30 focus:outline-none focus:border-fuchsia-400 text-white"
                                            />
                                            <button type="submit" className="px-4 py-2 bg-fuchsia-600 text-white font-bold text-xs rounded uppercase tracking-wider">Entrar</button>
                                        </div>
                                    </form>
                                ) : (
                                    <div className="space-y-3">
                                        <h3 className="text-xs font-bold text-cyan-400 uppercase tracking-widest">Inyector Automático de 2.5MB</h3>
                                        
                                        <div className="flex gap-2">
                                            <input 
                                                type="url" placeholder="Pega el enlace .mp3 de archive.org aquí..." 
                                                value={inputUrlArchive} onChange={(e) => setInputUrlArchive(e.target.value)}
                                                className="flex-1 bg-[#150d33] p-2 text-xs rounded border border-cyan-500/20 focus:outline-none text-white"
                                            />
                                            <button 
                                                onClick={procesarEnlaceArchive}
                                                className="px-4 py-1 bg-cyan-600 hover:bg-cyan-500 text-black font-bold text-xs rounded uppercase"
                                            >
                                                Extraer
                                            </button>
                                        </div>

                                        {estadoInyector && <p className="text-[11px] text-fuchsia-400 font-mono italic">{estadoInyector}</p>}

                                        {/* Bloque de Confirmación y Guardado Automático */}
                                        {datosExtraidos && (
                                            <div className="p-2 bg-[#120a2b] border border-cyan-500/30 rounded space-y-2">
                                                <div className="flex items-center gap-2">
                                                    <img src={datosExtraidos.portada} className="w-10 h-10 rounded object-cover" />
                                                    <div className="truncate flex-1">
                                                        <p className="text-xs font-bold text-white truncate">{datosExtraidos.titulo}</p>
                                                        <p className="text-[11px] text-gray-400 truncate">{datosExtraidos.artista}</p>
                                                    </div>
                                                </div>
                                                
                                                <button 
                                                    onClick={aplicarYGuardarEnFirebase}
                                                    className="w-full py-2 bg-gradient-to-r from-green-500 to-cyan-500 text-black font-black text-xs uppercase rounded shadow-lg hover:opacity-90 transition"
                                                >
                                                    💾 GUARDAR CAMBIOS EN FIREBASE
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Disco de Carátula */}
                        <div className="flex justify-center my-6">
                            <div className={`w-56 h-56 rounded-full border-4 border-cyan-400 p-1 shadow-[0_0_35px_rgba(6,182,212,0.3)] ${isPlaying ? 'animate-spin-slow' : ''}`}>
                                <img 
                                    src={trackActual.portadaUrl} alt="Carátula" 
                                    className="w-full h-full object-cover rounded-full select-none"
                                    onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500"; }}
                                />
                            </div>
                        </div>

                        {/* Info Track */}
                        <div className="text-center mb-4">
                            <h2 className="text-xl font-bold tracking-wide text-white truncate px-2">{trackActual.titulo}</h2>
                            <p className="text-sm text-fuchsia-400 font-medium tracking-wide mt-0.5 truncate px-4">{trackActual.artista}</p>
                        </div>

                        {/* BOTÓN DE DESCARGA DIRECTA EDITADO (SIN NUEVAS PESTAÑAS) */}
                        {canciones.length > 0 && trackActual.mp3Url && (
                            <div className="flex justify-center mb-5">
                                <button 
                                    onClick={(e) => descargarArchivoMp3(e, trackActual.mp3Url, trackActual.titulo)}
                                    className="flex items-center gap-2 px-4 py-1.5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 rounded-full text-xs text-neutral-300 font-medium transition cursor-pointer disabled:opacity-50"
                                    disabled={descargandoMedia}
                                >
                                    <DownloadIcon />
                                    <span>{descargandoMedia ? "Descargando Archivo..." : "Descargar MP3 Original"}</span>
                                </button>
                            </div>
                        )}

                        {/* Barra Progreso */}
                        <div className="mb-6">
                            <input 
                                type="range" min="0" max={duration || 0} value={progress} onChange={cambiarProgreso}
                                className="w-full h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer text-cyan-400"
                            />
                            <div className="flex justify-between text-xs text-neutral-400 mt-2 font-mono">
                                <span>{Math.floor(progress/60)}:{( "0" + Math.floor(progress%60) ).slice(-2)}</span>
                                <span>{duration ? `${Math.floor(duration/60)}:${("0"+Math.floor(duration%60)).slice(-2)}` : "0:00"}</span>
                            </div>
                        </div>

                        {/* Controles */}
                        <div className="flex justify-center items-center gap-6 mb-6">
                            <button onClick={anteriorCancion} className="text-cyan-400 p-2"><SkipBackIcon /></button>
                            <button onClick={alternarReproduccion} className="w-14 h-14 bg-cyan-500 text-black rounded-full flex items-center justify-center neon-glow-btn">
                                {isPlaying ? <PauseIcon /> : <PlayIcon />}
                            </button>
                            <button onClick={siguienteCancion} className="text-cyan-400 p-2"><SkipForwardIcon /></button>
                        </div>

                        {/* Playlist */}
                        <div className="mt-4 border-t border-neutral-800/60 pt-4">
                            <h4 className="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-2">Playlist en la Nube ({canciones.length})</h4>
                            <div className="max-h-40 overflow-y-auto custom-scrollbar space-y-1">
                                {canciones.map((can, index) => (
                                    <div 
                                        key={can.id} 
                                        className={`flex justify-between items-center p-2 rounded text-xs cursor-pointer ${index === currentTrackIndex ? 'bg-cyan-500/10 text-cyan-300' : 'text-neutral-300'}`}
                                        onClick={() => { setCurrentTrackIndex(index); setIsPlaying(true); }}
                                    >
                                        <div className="truncate flex-1 font-bold">{can.titulo} - {can.artista}</div>
                                        {esAdmin && (
                                            <button onClick={(e) => { e.stopPropagation(); eliminarCancion(can.id); }} className="text-red-400 p-1">
                                                <TrashIcon />
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(App);
        root.render(<App />);
    </script>
</body>
</html>
