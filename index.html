
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psicosis Music</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050510;
color:white;
overflow-x:hidden;
}

header{
padding:20px;
text-align:center;
font-size:2.5rem;
font-weight:bold;
color:#00ffee;
text-shadow:0 0 20px #00ffee;
cursor:pointer;
}

.search-box{
width:90%;
max-width:500px;
margin:20px auto;
display:flex;
}

.search-box input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:15px;
background:#111827;
color:white;
font-size:16px;
box-shadow:0 0 15px #00ffee55;
}

#songs{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111827;
border-radius:20px;
padding:15px;
box-shadow:0 0 15px #00ffee33;
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
box-shadow:0 0 25px #00ffee88;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
}

.card h3{
margin-top:10px;
}

.card p{
opacity:0.8;
margin-bottom:10px;
}

.buttons{
display:flex;
gap:10px;
margin-top:10px;
}

button{
flex:1;
padding:10px;
border:none;
border-radius:12px;
cursor:pointer;
background:#00ffee;
color:black;
font-weight:bold;
}

.player{
position:fixed;
bottom:0;
left:0;
right:0;
background:#0f172a;
padding:15px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 -5px 20px #00ffee33;
}

.player img{
width:60px;
height:60px;
object-fit:cover;
border-radius:10px;
}

.player-info{
flex:1;
}

audio{
width:100%;
}

#adminPanel{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111827;
padding:25px;
border-radius:20px;
display:none;
z-index:999;
width:90%;
max-width:450px;
box-shadow:0 0 30px #00ffee88;
}

#adminPanel input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:#1f2937;
color:white;
}

.closeBtn{
background:red;
color:white;
margin-top:10px;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<header id="logo">PSICOSIS MUSIC</header>

<div class="search-box">
<input type="text" id="search" placeholder="Buscar canciones...">
</div>

<div id="songs"></div>

<div class="player">
<img id="playerCover" src="https://via.placeholder.com/60">
<div class="player-info">
<div id="playerTitle">No reproduciendo</div>
<audio id="audio" controls></audio>
</div>
</div>

<div id="adminPanel">
<h2>Administrador</h2>

<div id="loginBox">
<input type="text" id="adminUser" placeholder="Usuario">
<input type="password" id="adminPass" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="injector" class="hidden">
<input type="text" id="songTitle" placeholder="Título">
<input type="text" id="songArtist" placeholder="Artista">
<input type="text" id="songCover" placeholder="URL portada">
<input type="text" id="songUrl" placeholder="URL MP3 Archive.org">

<button onclick="saveSong()">Guardar Canción</button>
</div>

<button class="closeBtn" onclick="closeAdmin()">Cerrar</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
authDomain: "psicosismusic-2b04a.firebaseapp.com",
databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com",
projectId: "psicosismusic-2b04a",
storageBucket: "psicosismusic-2b04a.firebasestorage.app",
messagingSenderId: "233441166744",
appId: "1:233441166744:web:6757b5fb8d4fd1803697ed",
measurementId: "G-Q5T61C2MNE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const songsRef = ref(db,"songs");

const songsContainer = document.getElementById("songs");

let allSongs = [];

onValue(songsRef,(snapshot)=>{

songsContainer.innerHTML = "";
allSongs = [];

snapshot.forEach((child)=>{

const song = child.val();
song.id = child.key;

allSongs.push(song);

renderSong(song);

});

});

function renderSong(song){

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `
<img src="${song.cover || 'https://via.placeholder.com/300'}">
<h3>${song.title}</h3>
<p>${song.artist}</p>

<div class="buttons">
<button onclick="playSong('${song.audio}','${song.title}','${song.cover}')">Play</button>

<button onclick="downloadSong('${song.audio}','${song.title}')">Descargar</button>
</div>

<button onclick="deleteSong('${song.id}')">Eliminar</button>
`;

songsContainer.appendChild(card);

}

window.playSong = function(url,title,cover){

const audio = document.getElementById("audio");

audio.src = url;
audio.play();

document.getElementById("playerTitle").innerText = title;
document.getElementById("playerCover").src = cover || "https://via.placeholder.com/60";

}

window.downloadSong = async function(url,title){

try{

const response = await fetch(url);
const blob = await response.blob();

const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = title + ".mp3";
a.click();

}catch(e){

window.open(url,"_blank");

}

}

window.deleteSong = async function(id){

if(!window.isAdmin){
alert("Solo admin");
return;
}

await remove(ref(db,"songs/" + id));

}

window.saveSong = async function(){

const title = document.getElementById("songTitle").value;
const artist = document.getElementById("songArtist").value;
const cover = document.getElementById("songCover").value;
const audio = document.getElementById("songUrl").value;

if(!title || !audio){
alert("Completa datos");
return;
}

await push(songsRef,{
title,
artist,
cover,
audio,
createdAt:Date.now()
});

alert("Canción guardada");

}

document.getElementById("search").addEventListener("input",(e)=>{

const value = e.target.value.toLowerCase();

songsContainer.innerHTML = "";

allSongs
.filter(song=>
(song.title || "").toLowerCase().includes(value) ||
(song.artist || "").toLowerCase().includes(value)
)
.forEach(renderSong);

});

let clicks = 0;

document.getElementById("logo").addEventListener("click",()=>{

clicks++;

if(clicks >= 3){

document.getElementById("adminPanel").style.display = "block";

clicks = 0;

}

setTimeout(()=>{

clicks = 0;

},1500);

});

window.closeAdmin = function(){

document.getElementById("adminPanel").style.display = "none";

}

window.isAdmin = false;

window.login = function(){

const user = document.getElementById("adminUser").value;
const pass = document.getElementById("adminPass").value;

if(user === "admin" && pass === "psicosis123"){

window.isAdmin = true;

document.getElementById("injector").classList.remove("hidden");

alert("Bienvenido administrador");

}else{

alert("Datos incorrectos");

}

}

</script>

</body>
</html>
