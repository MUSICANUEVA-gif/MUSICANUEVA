<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicosis Music - Neon Cyberpunk</title>
    
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Librerías de React, ReactDOM y Babel CORRECTAS -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SDK de Firebase CORRECTO (Versión de compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #03000a; 
        }
        .animate-spin-slow {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .neon-glow-btn {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            transition: all 0.3s ease;
        }
        .neon-glow-btn:hover {
            box-shadow: 0 0 35px rgba(217, 70, 239, 0.8);
            transform: scale(1.05);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.3);
        }
        .neon-text-fuchsia {
            text-shadow: 0 0 8px rgba(217, 70, 239, 0.8), 0 0 20px rgba(217, 70, 239, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(3, 0, 10, 0.6);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(217, 70, 239, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }
    </style>
</head>
<body class="bg-[#03000a] text-neutral-200">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // --- CONFIGURACIÓN DE TU PROYECTO PSICOSISMUSIC ---
        const firebaseConfig = {
            apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
            authDomain: "psicosismusic-2b04a.firebaseapp.com",
            databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com/",
            projectId: "psicosismusic-2b04a",
            storageBucket: "psicosismusic-2b04a.firebasestorage.app",
            messagingSenderId: "233441166744",
            appId: "1:233441166744:web:6757b5fb8d4fd1803697ed"
        };

        // Inicializar Firebase de forma segura
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- ICONOS SVG ---
        const PlayIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const PauseIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
        const SkipForwardIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" strokeWidth="2"/></svg>;
        const SkipBackIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="5" x2="5" y2="19" stroke="currentColor" strokeWidth="2"/></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;

        function App() {
            const [canciones, setCanciones] = useState([]);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            const [panelAbierto, setPanelAbierto] = useState(false);

            // Formulario nueva canción
            const [nuevoTitulo, setNuevoTitulo] = useState("");
            const [nuevoArtista, setNuevoArtista] = useState("");
            const [nuevoMp3Url, setNuevoMp3Url] = useState("");
            const [nuevaPortadaUrl, setNuevaPortadaUrl] = useState("");

            const audioRef = useRef(null);

            // Conectar con Firebase Realtime Database
            useEffect(() => {
                const cancionesRef = db.ref('canciones');
                cancionesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const listaCargada = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setCanciones(listaCargada);
                    } else {
                        setCanciones([]);
                    }
                });
                return () => cancionesRef.off();
            }, []);

            // Control de reproducción
            useEffect(() => {
                if (audioRef.current) {
                    if (isPlaying && canciones.length > 0) {
                        audioRef.current.play().catch(() => setIsPlaying(false));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, currentTrackIndex, canciones]);

            const trackActual = canciones[currentTrackIndex] || {
                titulo: "Sin canciones",
                artista: "Sube música en el panel",
                mp3Url: "",
                portadaUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500"
            };

            const actualizarProgreso = () => {
                if (audioRef.current) setProgress(audioRef.current.currentTime);
            };

            const metadataCargada = () => {
                if (audioRef.current) setDuration(audioRef.current.duration);
            };

            const cambiarProgreso = (e) => {
                const nuevoTiempo = parseFloat(e.target.value);
                if (audioRef.current) {
                    audioRef.current.currentTime = nuevoTiempo;
                    setProgress(nuevoTiempo);
                }
            };

            const alternarReproduccion = () => {
                if(canciones.length > 0) setIsPlaying(!isPlaying);
            };

            const siguienteCancion = () => {
                if (canciones.length > 0) {
                    setCurrentTrackIndex((prev) => (prev + 1) % canciones.length);
                    setIsPlaying(true);
                }
            };

            const anteriorCancion = () => {
                if (canciones.length > 0) {
                    setCurrentTrackIndex((prev) => (prev - 1 + canciones.length) % canciones.length);
                    setIsPlaying(true);
                }
            };

            // Guardar en Firebase
            const guardarCancion = (e) => {
                e.preventDefault();
                if (!nuevoTitulo || !nuevoMp3Url) return alert("Título y Enlace MP3 obligatorios");

                db.ref('canciones').push({
                    titulo: nuevoTitulo,
                    artista: nuevoArtista || "Artista Desconocido",
                    mp3Url: nuevoMp3Url,
                    portadaUrl: nuevaPortadaUrl || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500"
                });

                setNuevoTitulo("");
                setNuevoArtista("");
                setNuevoMp3Url("");
                setNuevaPortadaUrl("");
            };

            // Eliminar de Firebase
            const eliminarCancion = (id) => {
                if(confirm("¿Eliminar esta canción?")) {
                    db.ref(`canciones/${id}`).remove();
                    setCurrentTrackIndex(0);
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-[#05010e] relative overflow-hidden">
                    
                    {/* Elemento de Audio Oculto */}
                    <audio 
                        ref={audioRef} 
                        src={trackActual.mp3Url} 
                        onTimeUpdate={actualizarProgreso} 
                        onLoadedMetadata={metadataCargada}
                        onEnded={siguienteCancion}
                    />

                    {/* Contenedor Principal */}
                    <div className="w-full max-w-md bg-[#0c061f]/90 border border-cyan-500/30 rounded-3xl p-6 backdrop-blur-xl z-10 shadow-2xl relative">
                        
                        {/* Encabezado */}
                        <div className="flex justify-between items-center mb-6">
                            <h1 className="text-xl font-black uppercase tracking-widest neon-text-cyan text-cyan-400">Psicosis Music</h1>
                            <button 
                                onClick={() => setPanelAbierto(!panelAbierto)}
                                className="px-3 py-1 text-xs border border-fuchsia-500 text-fuchsia-400 rounded-full hover:bg-fuchsia-500/20 transition"
                            >
                                {panelAbierto ? "Cerrar Panel" : "Añadir Música"}
                            </button>
                        </div>

                        {/* Panel de administración ocultable */}
                        {panelAbierto && (
                            <form onSubmit={guardarCancion} className="mb-6 p-4 bg-black/40 border border-fuchsia-500/30 rounded-xl space-y-3">
                                <h3 className="text-sm font-bold text-fuchsia-400 uppercase">Agregar a la Base de Datos</h3>
                                <input type="text" placeholder="Título" value={nuevoTitulo} onChange={e=>setNuevoTitulo(e.target.value)} className="w-full bg-[#150d33] p-2 text-xs rounded border border-cyan-500/20 focus:outline-none focus:border-cyan-400"/>
                                <input type="text" placeholder="Artista" value={nuevoArtista} onChange={e=>setNuevoArtista(e.target.value)} className="w-full bg-[#150d33] p-2 text-xs rounded border border-cyan-500/20 focus:outline-none focus:border-cyan-400"/>
                                <input type="text" placeholder="URL del archivo MP3" value={nuevoMp3Url} onChange={e=>setNuevoMp3Url(e.target.value)} className="w-full bg-[#150d33] p-2 text-xs rounded border border-cyan-500/20 focus:outline-none focus:border-cyan-400"/>
                                <input type="text" placeholder="URL de la Imagen de Portada" value={nuevaPortadaUrl} onChange={e=>setNuevaPortadaUrl(e.target.value)} className="w-full bg-[#150d33] p-2 text-xs rounded border border-cyan-500/20 focus:outline-none focus:border-cyan-400"/>
                                <button type="submit" className="w-full py-2 bg-gradient-to-r from-cyan-500 to-fuchsia-500 font-bold text-xs rounded text-black uppercase tracking-wider">Guardar en Firebase</button>
                            </form>
                        )}

                        {/* Portada en Disco Giratorio */}
                        <div className="flex justify-center my-6">
                            <div className={`w-52 h-52 rounded-full border-4 border-cyan-400/40 p-2 shadow-[0_0_30px_rgba(6,182,212,0.2)] ${isPlaying ? 'animate-spin-slow' : ''}`}>
                                <img 
                                    src={trackActual.portadaUrl} 
                                    alt="Portada" 
                                    className="w-full h-full object-cover rounded-full"
                                />
                            </div>
                        </div>

                        {/* Info de la Canción */}
                        <div className="text-center mb-6">
                            <h2 className="text-xl font-bold tracking-wide text-white truncate px-4">{trackActual.titulo}</h2>
                            <p className="text-sm text-fuchsia-400 font-medium tracking-wide mt-1">{trackActual.artista}</p>
                        </div>

                        {/* Barra de Progreso */}
                        <div className="mb-6">
                            <input 
                                type="range" 
                                min="0" 
                                max={duration || 0} 
                                value={progress} 
                                onChange={cambiarProgreso}
                                className="w-full h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer text-cyan-400"
                            />
                            <div className="flex justify-between text-xs text-neutral-400 mt-2 font-mono">
                                <span>{Math.floor(progress/60)}:{( "0" + Math.floor(progress%60) ).slice(-2)}</span>
                                <span>{duration ? `${Math.floor(duration/60)}:${("0"+Math.floor(duration%60)).slice(-2)}` : "0:00"}</span>
                            </div>
                        </div>

                        {/* Controles del Reproductor */}
                        <div className="flex justify-center items-center gap-6 mb-6">
                            <button onClick={anteriorCancion} className="text-cyan-400 hover:text-cyan-300 p-2 transition">
                                <SkipBackIcon />
                            </button>
                            <button onClick={alternarReproduccion} className="w-14 h-14 bg-cyan-500 text-black rounded-full flex items-center justify-center neon-glow-btn transition">
                                {isPlaying ? <PauseIcon /> : <PlayIcon />}
                            </button>
                            <button onClick={siguienteCancion} className="text-cyan-400 hover:text-cyan-300 p-2 transition">
                                <SkipForwardIcon />
                            </button>
                        </div>

                        {/* Lista de Canciones en la Base de Datos */}
                        <div className="mt-4 border-t border-neutral-800 pt-4">
                            <h4 className="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-2">Lista de reproducción ({canciones.length})</h4>
                            <div className="max-h-36 overflow-y-auto custom-scrollbar space-y-1 pr-1">
                                {canciones.map((can, index) => (
                                    <div 
                                        key={can.id} 
                                        className={`flex justify-between items-center p-2 rounded text-xs cursor-pointer transition ${index === currentTrackIndex ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'hover:bg-white/5 text-neutral-300'}`}
                                        onClick={() => { setCurrentTrackIndex(index); setIsPlaying(true); }}
                                    >
                                        <div className="truncate flex-1 pr-2">
                                            <span className="font-bold">{can.titulo}</span> - {can.artista}
                                        </div>
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); eliminarCancion(can.id); }}
                                            className="text-red-400 hover:text-red-500 p-1"
                                        >
                                            <TrashIcon />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
