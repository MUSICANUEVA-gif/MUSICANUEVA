<body class="bg-[#03000a] text-neutral-200">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { createRoot } = ReactDOM;

        // --- CONFIGURACIÓN DE TU PROYECTO PSICOSISMUSIC ---
        const firebaseConfig = {
            apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
            authDomain: "psicosismusic-2b04a.firebaseapp.com",
            databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com/",
            projectId: "psicosismusic-2b04a",
            storageBucket: "psicosismusic-2b04a.firebasestorage.app",
            messagingSenderId: "233441166744",
            appId: "1:233441166744:web:6757b5fb8d4fd1803697ed",
            measurementId: "G-Q5T61C2MNE"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- ICONOS ---
        const PlayIcon = ({ size = 24, ...props }) => <svg xmlns="http://w3.org" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const PauseIcon = ({ size = 24, ...props }) => <svg xmlns="http://w3.org" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
        const SkipForwardIcon = ({ size = 24, ...props }) => <svg xmlns="http://w3.org" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>;
        const SkipBackIcon = ({ size = 24, ...props }) => <svg xmlns="http://w3.org" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="5" x2="5" y2="19"/></svg>;
        const TrashIcon = ({ size = 24, ...props }) => <svg xmlns="http://w3.org" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const PlusIcon = ({ size = 24, ...props }) => <svg xmlns="http://w3.org" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;

        function App() {
            const [canciones, setCanciones] = useState([]);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            const [panelAbierto, setPanelAbierto] = useState(false);

            const [nuevoTitulo, setNuevoTitulo] = useState("");
            const [nuevoArtista, setNuevoArtista] = useState("");
            const [nuevoMp3Url, setNuevoMp3Url] = useState("");
            const [nuevaPortadaUrl, setNuevaPortadaUrl] = useState("");

            const audioRef = useRef(null);

            // Escuchar cambios en la base de datos en tiempo real
            useEffect(() => {
                const cancionesRef = db.ref('canciones');
                cancionesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const listaCargada = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setCanciones(listaCargada);
                    } else {
                        setCanciones([]);
                    }
                });
                return () => cancionesRef.off();
            }, []);

            // Control de reproducción de audio
            useEffect(() => {
                if (audioRef.current) {
                    if (isPlaying && canciones.length > 0) {
                        audioRef.current.play().catch(() => setIsPlaying(false));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, currentTrackIndex, canciones]);

            const actualizarProgreso = () => {
                if (audioRef.current) setProgress(audioRef.current.currentTime);
            };

            const metadataCargada = () => {
                if (audioRef.current) setDuration(audioRef.current.duration);
            };

            const cambiarProgreso = (e) => {
                const nuevoTiempo = parseFloat(e.target.value);
                if (audioRef.current) {
                    audioRef.current.currentTime = nuevoTiempo;
                    setProgress(nuevoTiempo);
                }
            };

            const agregarCancionFirebase = (e) => {
                e.preventDefault();
                if (!nuevoTitulo || !nuevoMp3Url) return alert("Completa el título y la URL de música");

                const nuevaCancion = {
                    titulo: nuevoTitulo,
                    artista: nuevoArtista || "Artista Desconocido",
                    url: nuevoMp3Url,
                    portada: nuevaPortadaUrl || "https://unsplash.com"
                };

                db.ref('canciones').push(nuevaCancion);

                setNuevoTitulo("");
                setNuevoArtista("");
                setNuevoMp3Url("");
                setNuevaPortadaUrl("");
                setPanelAbierto(false);
            };

            const eliminarCancionFirebase = (id) => {
                if (confirm("¿Eliminar canción de la nube?")) {
                    db.ref(`canciones/${id}`).remove();
                }
            };

            const cancionActual = canciones[currentTrackIndex] || {
                titulo: "Sin canciones",
                artista: "Usa el panel de creador",
                portada: "https://unsplash.com",
                url: ""
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6">
                    {canciones.length > 0 && (
                        <audio 
                            ref={audioRef} 
                            src={cancionActual.url} 
                            onTimeUpdate={actualizarProgreso}
                            onLoadedMetadata={metadataCargada}
