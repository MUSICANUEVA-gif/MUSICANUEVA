<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicosis Music - Neon Cyberpunk</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #03000a; 
        }
        
        .animate-spin-slow {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .neon-glow-btn {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            transition: all 0.3s ease;
        }
        .neon-glow-btn:hover {
            box-shadow: 0 0 35px rgba(217, 70, 239, 0.8);
            transform: scale(1.05);
        }

        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.3);
        }
        .neon-text-fuchsia {
            text-shadow: 0 0 8px rgba(217, 70, 239, 0.8), 0 0 20px rgba(217, 70, 239, 0.3);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(3, 0, 10, 0.6);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(217, 70, 239, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 12px currentColor;
            border: 2px solid #03000a;
        }
    </style>
</head>
<body class="bg-[#03000a] text-neutral-200">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { createRoot } = ReactDOM;

        // --- ICONOS ---
        const PlayIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const PauseIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
        const SkipForwardIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>;
        const SkipBackIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="5" x2="5" y2="19"/></svg>;
        const Volume2Icon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>;
        const VolumeXIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>;
        const DownloadIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const PlusIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const DiscIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>;
        const ZapIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
        const TrashIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const SearchIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const XIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const CheckIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="20 6 9 17 4 12"/></svg>;
        const MusicIcon = ({ size = 24, ...props }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>;

        let appId = 'psicosis-music-app';
        let firebaseEnabled = false;

        function App() {
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(0.8);
            const [isMuted, setIsMuted] = useState(false);
            const [errorMessage, setErrorMessage] = useState("");
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [inputUrl, setInputUrl] = useState("");
            const [searchTerm, setSearchTerm] = useState("");
            
            const [isBuffering, setIsBuffering] = useState(false);
            const [resolvedAudioSrc, setResolvedAudioSrc] = useState("");
            const [cloudSongs, setCloudSongs] = useState([]);
            const [deletedDefaultIds, setDeletedDefaultIds] = useState(() => {
                try {
                    const saved = localStorage.getItem('psicosis_deleted_defaults');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            const [user, setUser] = useState(null);
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [firebaseReady, setFirebaseReady] = useState(false);
            const audioRef = useRef(null);

            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminModal, setShowAdminModal] = useState(false);
            const [adminPasswordInput, setAdminPasswordInput] = useState("");

            const defaultSongs = [
                {
                    id: "default_1",
                    title: "PAL TO",
                    artist: "Austin San",
                    album: "Sencillo Oficial",
                    src: "https://ia600400.us.archive.org/29/items/austin-san-pal-to/Austin%20San%20-%20PAL%20TO.mp3",
                    cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80"
                },
                {
                    id: "default_2",
                    title: "NUEVAYoL",
                    artist: "Bad Bunny",
                    album: "Nadie Sabe Lo Que Va A Pasar Mañana",
                    src: "https://ia902803.us.archive.org/29/items/01.-bad-bunny-nuevayo-l/01.%20Bad%20Bunny%20-%20NUEVAYoL.mp3",
                    cover: "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/cb/21/e4/cb21e427-46e3-15ea-f01f-0ec034f54eb7/38477.jpg/600x600bb.jpg"
                }
            ];

            useEffect(() => {
                const loadFirebase = async () => {
                    try {
                        const firebaseConfig = {
                            apiKey: "AIzaSyAznXQHLb2b_cOBDIPteN2TPmY8WBmf0fw",
                            authDomain: "psicosismusic-2b04a.firebaseapp.com",
                            projectId: "psicosismusic-2b04a",
                            storageBucket: "psicosismusic-2b04a.firebasestorage.app",
                            messagingSenderId: "233441166744",
                            appId: "1:233441166744:web:6757b5fb8d4fd1803697ed",
                            measurementId: "G-Q5T61C2MNE"
                        };

                        const { initializeApp: initApp } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                        const { getAuth: gAuth, signInAnonymously, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                        const { getFirestore: gFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');

                        const appInstance = initApp(firebaseConfig);
                        const authInstance = gAuth(appInstance);
                        const dbInstance = gFirestore(appInstance);

                        window.firebaseMethods = { doc, setDoc, getDoc, collection, getDocs, deleteDoc, onSnapshot, signInAnonymously, onAuthStateChanged };

                        setAuth(authInstance);
                        setDb(dbInstance);
                        firebaseEnabled = true;
                        setFirebaseReady(true);
                    } catch (e) {
                        console.warn("Fallo Firebase, Modo Local activo:", e);
                        initializeLocalSongs();
                    }
                };

                const initializeLocalSongs = () => {
                    const savedSongs = localStorage.getItem('psicosis_local_songs');
                    if (savedSongs) {
                        try {
                            const parsedSongs = JSON.parse(savedSongs).map((track, idx) => ({ ...track, id: track.id || `local_song_${idx}_${Date.now()}` }));
                            setCloudSongs(parsedSongs);
                        } catch (e) { setCloudSongs([]); }
                    }
                    if (localStorage.getItem('psicosis_admin') === 'true') setIsAdmin(true);
                };

                loadFirebase();
            }, []);

            useEffect(() => {
                if (!firebaseReady || !auth) return;
                const { signInAnonymously, onAuthStateChanged } = window.firebaseMethods;
                const initAuth = async () => { try { await signInAnonymously(auth); } catch (err) {} };
                initAuth();
                
                const unsubscribe = onAuthStateChanged(auth, (usr) => {
                    setUser(usr);
                    if (localStorage.getItem('psicosis_admin') === 'true') setIsAdmin(true);
                });
                return () => unsubscribe();
            }, [firebaseReady, auth]);

            useEffect(() => {
                if (!firebaseReady || !db || !user) return;
                const { collection, onSnapshot, doc } = window.firebaseMethods;
                const songsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'songs');
                const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'deleted_defaults');
                
                const unsubscribeSongs = onSnapshot(songsColRef, (snapshot) => {
                    const cloudSongsList = [];
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        cloudSongsList.push({ ...data, id: data.id || doc.id });
                    });
                    cloudSongsList.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                    setCloudSongs(cloudSongsList);
                });

                const unsubscribeSettings = onSnapshot(settingsDocRef, (docSnap) => {
                    if (docSnap.exists()) setDeletedDefaultIds(docSnap.data().ids || []);
                });
                
                return () => { unsubscribeSongs(); unsubscribeSettings(); };
            }, [firebaseReady, db, user]);

            const visibleDefaults = defaultSongs.filter(s => !deletedDefaultIds.includes(s.id));
            const playlist = [...visibleDefaults, ...cloudSongs];
            const currentTrack = playlist[currentTrackIndex];
            const coverSrc = currentTrack?.cover || "";
            const fallbackCover = "https://placehold.co/600x600/03000a/c026d3?text=PSICOSIS+NEON";

            useEffect(() => {
                if (!currentTrack) return;
                setResolvedAudioSrc(currentTrack.src);
            }, [currentTrackIndex, playlist]);

            useEffect(() => {
                if (audioRef.current && resolvedAudioSrc) {
                    audioRef.current.load();
                    if (isPlaying) {
                        const playPromise = audioRef.current.play();
                        if (playPromise !== undefined) playPromise.catch(e => { setIsPlaying(false); });
                    }
                }
            }, [resolvedAudioSrc]);

            const handleAdminAccess = () => {
                if (isAdmin) return;
                setShowAdminModal(true);
            };

            const handleAdminSubmit = () => {
                if (adminPasswordInput === "psicosis") {
                    setIsAdmin(true);
                    localStorage.setItem('psicosis_admin', 'true');
                    setErrorMessage("¡Panel Creador Desbloqueado! 🔓");
                    setShowAdminModal(false);
                    setAdminPasswordInput("");
                    setTimeout(() => setErrorMessage(""), 3000);
                } else {
                    setErrorMessage("Clave incorrecta ❌");
                    setAdminPasswordInput("");
                    setTimeout(() => setErrorMessage(""), 3000);
                }
            };

            const closeAndSaveAdminPanel = () => {
                setIsAdmin(false);
                localStorage.removeItem('psicosis_admin');
                setErrorMessage("¡Cambios Guardados! Panel cerrado de forma segura. 🔒");
                setTimeout(() => setErrorMessage(""), 4000);
            };

            const handleAddTrack = async (e) => {
                e.preventDefault();
                const urlToAdd = inputUrl.trim();
                if (!urlToAdd) return;

                const isDuplicate = playlist.some(track => track.src === urlToAdd);
                if (isDuplicate) {
                    setErrorMessage("⚠️ Este enlace ya está en la cola.");
                    setTimeout(() => setErrorMessage(""), 3000);
                    return;
                }

                setErrorMessage("Extrayendo ID3 y Carátula original del MP3... 💽");

                const urlParts = urlToAdd.split('/');
                let decodedTitle = decodeURIComponent(urlParts[urlParts.length - 1]);
                let baseName = decodedTitle.replace(/\.[a-zA-Z0-9]+$/i, ''); 

                let finalTitle = baseName;
                let finalArtist = "Artista Desconocido";
                let finalAlbum = "Sencillo";
                let finalCover = fallbackCover;

                try {
                    const bypassUrl = urlToAdd + (urlToAdd.includes('?') ? '&' : '?') + '_psicosis_id3_bypass=' + Date.now();
                    const response = await fetch(bypassUrl, { mode: 'cors' });
                    
                    if (response.ok) {
                        const reader = response.body.getReader();
                        const chunks = [];
                        let receivedLength = 0;
                        const maxBytesToRead = 2.5 * 1024 * 1024; 

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            chunks.push(value);
                            receivedLength += value.length;
                            if (receivedLength >= maxBytesToRead) { await reader.cancel(); break; }
                        }

                        const mergedBuffer = new Uint8Array(receivedLength);
                        let position = 0;
                        for (let chunk of chunks) {
                            mergedBuffer.set(chunk, position);
                            position += chunk.length;
                        }

                        const audioBlob = new Blob([mergedBuffer], { type: 'audio/mpeg' });

                        const tags = await new Promise((resolve, reject) => {
                            if (window.jsmediatags) {
                                window.jsmediatags.read(audioBlob, { onSuccess: (tag) => resolve(tag.tags), onError: (err) => reject(err) });
                            } else { reject("Librería de metadatos no disponible"); }
                        });

                        if (tags) {
                            if (tags.title) finalTitle = tags.title;
                            if (tags.artist) finalArtist = tags.artist;
                            if (tags.album) finalAlbum = tags.album;
                            
                            if (tags.picture) {
                                const { data, format } = tags.picture;
                                let base64String = "";
                                const bytes = new Uint8Array(data);
                                const CHUNK_SIZE = 0x8000; 
                                for (let i = 0; i < bytes.length; i += CHUNK_SIZE) {
                                    base64String += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK_SIZE));
                                }
                                finalCover = `data:${format};base64,${btoa(base64String)}`;
                            }
                        }
                    }
                } catch (err) {
                    console.log("No se detectó un ID3 tag válido en los primeros 2.5MB del MP3 o el servidor bloqueó la lectura.", err);
                }

                const newTrack = { id: 'song_' + Date.now(), title: finalTitle, artist: finalArtist, album: finalAlbum, src: urlToAdd, cover: finalCover, createdAt: Date.now() };

                if (firebaseEnabled && db && user) {
                    const { doc, setDoc } = window.firebaseMethods;
                    try {
                        const songDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'songs', newTrack.id);
                        await setDoc(songDocRef, newTrack);
                        setErrorMessage("¡Todo incrustado y guardado en la nube automáticamente! 🎉🔥");
                    } catch (err) { setErrorMessage("Error de permisos en Firebase ❌"); }
                } else {
                    const updatedSongs = [...cloudSongs, newTrack];
                    localStorage.setItem('psicosis_local_songs', JSON.stringify(updatedSongs));
                    setCloudSongs(updatedSongs);
                    setErrorMessage("¡Guardado localmente! ⚠️");
                }

                setInputUrl("");
                setTimeout(() => setErrorMessage(""), 4000);
            };

            const removeTrack = async (index, e) => {
                e.stopPropagation();
                const trackToDelete = playlist[index];
                if (!trackToDelete) return;
                
                const trackId = trackToDelete.id || '';
                setErrorMessage("Eliminando... 🗑️");
                
                if (trackId.startsWith("default_")) {
                    const updatedDeleted = [...deletedDefaultIds, trackId];
                    if (firebaseEnabled && db && user) {
                        const { doc, setDoc } = window.firebaseMethods;
                        try {
                            const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'deleted_defaults');
                            await setDoc(settingsDocRef, { ids: updatedDeleted });
                            setErrorMessage("¡Pista eliminada de la nube! ✅");
                        } catch (err) { setErrorMessage("Fallo al borrar en la nube ❌"); }
                    }
                } else {
                    if (firebaseEnabled && db && user) {
                        const { doc, deleteDoc } = window.firebaseMethods;
                        try {
                            const songDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'songs', trackId);
                            await deleteDoc(songDocRef);
                            setErrorMessage("¡Track eliminado permanentemente de la base de datos! ✅");
                        } catch (err) { setErrorMessage("Fallo al borrar en la nube ❌"); }
                    }
                }

                if (currentTrackIndex === index) {
                    setCurrentTrackIndex(0);
                    setIsPlaying(false);
                } else if (currentTrackIndex > index) {
                    setCurrentTrackIndex(currentTrackIndex - 1);
                }
                setTimeout(() => setErrorMessage(""), 3000);
            };

            const playTrack = (index) => {
                if (isBuffering) return;
                setCurrentTrackIndex(index);
                setIsPlaying(true);
            };

            const togglePlay = async () => {
                if (!resolvedAudioSrc || isBuffering) return;
                if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); } 
                else {
                    try { await audioRef.current.play(); setIsPlaying(true); setErrorMessage(""); } 
                    catch (error) { setIsPlaying(false); setErrorMessage("Error. ¿Enlace termina en .mp3? ❌"); setTimeout(() => setErrorMessage(""), 5000); }
                }
            };

            const handleTimeUpdate = () => setProgress(audioRef.current.currentTime);
            const handleLoadedMetadata = () => setDuration(audioRef.current.duration);
            const handleProgressChange = (e) => { const newTime = e.target.value; if(audioRef.current) audioRef.current.currentTime = newTime; setProgress(newTime); };
            const handleVolumeChange = (e) => { const newVolume = parseFloat(e.target.value); setVolume(newVolume); if (audioRef.current) audioRef.current.volume = newVolume; setIsMuted(newVolume === 0); };
            const toggleMute = () => { if (isMuted) { if(audioRef.current) audioRef.current.volume = volume || 0.5; setIsMuted(false); } else { if(audioRef.current) audioRef.current.volume = 0; setIsMuted(true); } };
            const handleNext = () => { if (isBuffering) return; setCurrentTrackIndex((prev) => (prev + 1) % playlist.length); };
            const handlePrev = () => { if (isBuffering) return; setCurrentTrackIndex((prev) => (prev - 1 + playlist.length) % playlist.length); };
            const handleDownload = async () => { try { setErrorMessage("Abriendo descarga... ⏳"); window.open(resolvedAudioSrc, '_blank'); setTimeout(() => setErrorMessage(""), 3000); } catch (error) { setErrorMessage("Error al descargar."); } };
            const formatTime = (time) => { if (!time || isNaN(time)) return "0:00"; const minutes = Math.floor(time / 60); const seconds = Math.floor(time % 60); return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`; };

            return (
                <div className="min-h-screen w-full font-sans text-neutral-200 selection:bg-cyan-500 selection:text-black flex flex-col items-center justify-center p-4 relative overflow-hidden bg-[#03000a]">
                    <div className="absolute top-[-15%] left-[-15%] w-[50vw] h-[50vw] bg-fuchsia-600/15 rounded-full blur-[140px] pointer-events-none animate-pulse"></div>
                    <div className="absolute bottom-[-15%] right-[-15%] w-[50vw] h-[50vw] bg-cyan-600/15 rounded-full blur-[140px] pointer-events-none animate-pulse" style={{ animationDelay: '1s' }}></div>
                    <div className="absolute top-1/2 left-1/3 w-[30vw] h-[30vw] bg-violet-600/10 rounded-full blur-[120px] pointer-events-none"></div>

                    {errorMessage && (
                        <div className="absolute top-6 z-50 bg-[#060012]/95 border-2 border-cyan-500 text-cyan-300 px-6 py-3 rounded-md shadow-[0_0_20px_rgba(6,182,212,0.8)] font-bold text-sm tracking-widest uppercase flex items-center gap-3 backdrop-blur-md">
                            <ZapIcon size={18} className="text-cyan-400 animate-bounce" /> {errorMessage}
                        </div>
                    )}
