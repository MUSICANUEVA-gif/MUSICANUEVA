<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicosis Music - Neon Cyberpunk</title>
    
    <!-- Tailwind CSS para el diseño de la interfaz -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Librerías de React, ReactDOM y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SDK de Firebase para conectar tu Base de Datos -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Librería jsmediatags para extraer la carátula oculta del MP3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #03000a; 
        }
        .animate-spin-slow {
            animation: spin 12s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .neon-glow-btn {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            transition: all 0.3s ease;
        }
        .neon-glow-btn:hover {
            box-shadow: 0 0 35px rgba(217, 70, 239, 0.8);
            transform: scale(1.05);
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(3, 0, 10, 0.6);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(217, 70, 239, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #06b6d4;
            cursor: pointer;
            box-shadow: 0 0 10px #06b6d4;
        }
    </style>
</head>
<body class="bg-[#03000a] text-neutral-200">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const { createRoot } = ReactDOM;

        // --- CONFIGURACIÓN EXACTA DE TU PROYECTO PSICOSISMUSIC ---
        const firebaseConfig = {
            apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
            authDomain: "psicosismusic-2b04a.firebaseapp.com",
            databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com/",
            projectId: "psicosismusic-2b04a",
            storageBucket: "psicosismusic-2b04a.firebasestorage.app",
            messagingSenderId: "233441166744",
            appId: "1:233441166744:web:6757b5fb8d4fd1803697ed"
        };

        // Inicialización segura de Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- COMPONENTES DE ICONOS ---
        const PlayIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const PauseIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
        const SkipForwardIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>;
        const SkipBackIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="5" x2="5" y2="19"/></svg>;
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const DownloadIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;

        function App() {
            const [canciones, setCanciones] = useState([]);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            
            // Estados del Inyector Secreto
            const [panelAbierto, setPanelAbierto] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [esAdmin, setEsAdmin] = useState(false);
            const [inputUrlArchive, setInputUrlArchive] = useState("");
            const [procesandoInyeccion, setProcesandoInyeccion] = useState(false);

            const audioRef = useRef(null);

            // Cargar base de datos en tiempo real desde Firebase
            useEffect(() => {
                const cancionesRef = db.ref('canciones');
                cancionesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const lista = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setCanciones(lista);
                    } else {
                        setCanciones([]);
                    }
                });
                return () => cancionesRef.off();
            }, []);

            // Manejar reproducción del elemento de audio
            useEffect(() => {
                if (audioRef.current) {
                    if (isPlaying && canciones.length > 0) {
                        audioRef.current.play().catch(() => setIsPlaying(false));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, currentTrackIndex, canciones]);

            // Track por defecto si Firebase está vacío
            const trackActual = canciones[currentTrackIndex] || {
                titulo: "Psicosis Music",
                artista: "Inyecta un enlace para empezar",
                mp3Url: "",
                portadaUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500"
            };

            const actualizarProgreso = () => {
                if (audioRef.current) setProgress(audioRef.current.currentTime);
            };

            const metadataCargada = () => {
                if (audioRef.current) setDuration(audioRef.current.duration);
            };

            const cambiarProgreso = (e) => {
                const nuevoTiempo = parseFloat(e.target.value);
                if (audioRef.current) {
                    audioRef.current.currentTime = nuevoTiempo;
                    setProgress(nuevoTiempo);
                }
            };

            const alternarReproduccion = () => {
                if (canciones.length > 0) setIsPlaying(!isPlaying);
            };

            const siguienteCancion = () => {
                if (canciones.length > 0) {
                    setCurrentTrackIndex((prev) => (prev + 1) % canciones.length);
                    setIsPlaying(true);
                }
            };

            const anteriorCancion = () => {
                if (canciones.length > 0) {
                    setCurrentTrackIndex((prev) => (prev - 1 + canciones.length) % canciones.length);
                    setIsPlaying(true);
                }
            };

            // Lógica de Login Secreto
            const verificarPassword = (e) => {
                e.preventDefault();
                if (passwordInput === "psicosis") {
                    setEsAdmin(true);
                    setPasswordInput("");
                } else {
                    alert("Contraseña Incorrecta");
                }
            };

            // INYECTOR INTELIGENTE: Extraer metadatos e imagen desde Archive.org
            const procesarEInyectarEnlace = async (e) => {
                e.preventDefault();
                if (!inputUrlArchive.trim()) return;

                setProcesandoInyeccion(true);
                let tituloDetectado = "Canción Inyectada";
                let artistaDetectado = "Archive.org";
                let caratulaExtraida = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500"; // Fallback por defecto

                // Intentar extraer el nombre del archivo desde la URL para un título limpio inicial
                try {
                    const decodificado = decodeURIComponent(inputUrlArchive);
                    const nombreArchivo = decodificado.substring(decodificado.lastIndexOf('/') + 1);
                    tituloDetectado = nombreArchivo.replace(".mp3", "");
                } catch(err){}

                // Utilizar jsmediatags de manera remota
                jsmediatags.read(inputUrlArchive, {
                    onSuccess: function(tag) {
                        // Extraer título y artista de las etiquetas ID3 reales
                        if (tag.tags.title) tituloDetectado = tag.tags.title;
                        if (tag.tags.artist) artistaDetectado = tag.tags.artist;
                        
                        // Extraer imagen incrustada de los metadatos de la canción
                        const image = tag.tags.picture;
                        if (image) {
                            let base64String = "";
                            for (let i = 0; i < image.data.length; i++) {
                                base64String += String.fromCharCode(image.data[i]);
                            }
                            const base64 = "data:" + image.format + ";base64," + window.btoa(base64String);
                            caratulaExtraida = base64;
                        }

                        // Guardar automáticamente los datos extraídos en Firebase
                        subirAFirebase(tituloDetectado, artistaDetectado, inputUrlArchive, caratulaExtraida);
                    },
                    onError: function(error) {
                        console.log('No se pudieron leer etiquetas incrustadas internas, usando datos de URL por defecto:', error.type);
                        // Si falla la extracción profunda de imagen, guarda de todos modos con los datos limpios de la URL
                        subirAFirebase(tituloDetectado, artistaDetectado, inputUrlArchive, caratulaExtraida);
                    }
                });
            };

            const subirAFirebase = (titulo, artista, url, portada) => {
                db.ref('canciones').push({
                    titulo: titulo,
                    artista: artista,
                    mp3Url: url,
                    portadaUrl: portada
                }, (error) => {
                    setProcesandoInyeccion(false);
                    if (error) {
                        alert("Error al inyectar en Firebase");
                    } else {
                        setInputUrlArchive("");
                        alert("¡Enlace Archive.org inyectado con éxito!");
                    }
                });
            };

            // Eliminar Canción desde Firebase
            const eliminarCancion = (id) => {
                if (confirm("¿Estás seguro de que quieres eliminar esta canción de la base de datos pública?")) {
                    db.ref(`canciones/${id}`).remove();
                    setCurrentTrackIndex(0);
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-[#05010e] relative overflow-hidden">
                    
                    {/* Elemento HTML5 de Audio */}
                    <audio 
                        ref={audioRef} 
                        src={trackActual.mp3Url} 
                        onTimeUpdate={actualizarProgreso} 
                        onLoadedMetadata={metadataCargada}
                        onEnded={siguienteCancion}
                    />

                    {/* Contenedor del Reproductor Cyberpunk */}
                    <div className="w-full max-w-md bg-[#0c061f]/90 border border-cyan-500/30 rounded-3xl p-6 backdrop-blur-xl z-10 shadow-[0_0_50px_rgba(6,182,212,0.15)] relative">
                        
                        {/* Encabezado */}
                        <div className="flex justify-between items-center mb-6">
                            <h1 className="text-xl font-black uppercase tracking-widest neon-text-cyan text-cyan-400">Psicosis Music</h1>
                            <button 
                                onClick={() => setPanelAbierto(!panelAbierto)}
                                className="px-3 py-1 text-xs font-bold border border-fuchsia-500 text-fuchsia-400 rounded-full hover:bg-fuchsia-500/20 transition"
                            >
                                {panelAbierto ? "Ocultar Inyector" : "Modo Inyector"}
                            </button>
                        </div>

                        {/* PANEL INYECTOR SECRETO CON CONTRASEÑA */}
                        {panelAbierto && (
                            <div className="mb-6 p-4 bg-black/50 border border-fuchsia-500/40 rounded-2xl space-y-4">
                                {!esAdmin ? (
                                    /* Login Secreto */
                                    <form onSubmit={verificarPassword} className="space-y-2">
                                        <label className="text-xs font-bold text-fuchsia-400 uppercase tracking-wider block">Llave de Administrador:</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="password" 
                                                placeholder="Introduce la contraseña..." 
                                                value={passwordInput}
                                                onChange={(e) => setPasswordInput(e.target.value)}
                                                className="flex-1 bg-[#150d33] p-2 text-sm rounded border border-fuchsia-500/30 focus:outline-none focus:border-fuchsia-400 text-white"
                                            />
                                            <button type="submit" className="px-4 py-2 bg-fuchsia-600 text-white font-bold text-xs rounded uppercase tracking-wider hover:bg-fuchsia-500">Entrar</button>
                                        </div>
                                    </form>
                                ) : (
                                    /* Inyector de Enlaces Autorizado */
                                    <form onSubmit={procesarEInyectarEnlace} className="space-y-3">
                                        <div className="flex justify-between items-center">
                                            <h3 className="text-xs font-bold text-cyan-400 uppercase tracking-widest">Inyector Inteligente Activo</h3>
                                            <span className="text-[10px] bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full font-bold">Admin</span>
                                        </div>
                                        <p className="text-[11px] text-neutral-400">Pega un enlace directo de audio de archive.org. El sistema extraerá de forma automática el título, artista y la carátula oculta de los metadatos.</p>
                                        <input 
                                            type="url" 
                                            required
                                            placeholder="https://ia80.../cancion.mp3" 
                                            value={inputUrlArchive}
                                            onChange={(e) => setInputUrlArchive(e.target.value)}
                                            className="w-full bg-[#150d33] p-2 text-xs rounded border border-cyan-500/30 focus:outline-none focus:border-cyan-400 text-white"
                                        />
                                        <button 
                                            type="submit" 
                                            disabled={procesandoInyeccion}
                                            className="w-full py-2 bg-gradient-to-r from-cyan-500 to-fuchsia-500 font-bold text-xs rounded text-black uppercase tracking-wider disabled:opacity-50"
                                        >
                                            {procesandoInyeccion ? "Extrayendo Metadatos y Carátula..." : "Inyectar y Publicar en Firebase"}
                                        </button>
                                    </form>
                                )}
                            </div>
                        )}

                        {/* Reproductor - Disco Giratorio de Carátula */}
                        <div className="flex justify-center my-6">
                            <div className={`w-56 h-56 rounded-full border-4 border-cyan-400 p-1 shadow-[0_0_35px_rgba(6,182,212,0.3)] ${isPlaying ? 'animate-spin-slow' : ''}`}>
                                <img 
                                    src={trackActual.portadaUrl} 
                                    alt="Carátula" 
                                    className="w-full h-full object-cover rounded-full select-none"
                                    onError={(e) => {
                                        e.target.src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500";
                                    }}
                                />
                            </div>
                        </div>

                        {/* Datos de la Canción Actual */}
                        <div className="text-center mb-4">
                            <h2 className="text-xl font-bold tracking-wide text-white truncate px-2">{trackActual.titulo}</h2>
                            <p className="text-sm text-fuchsia-400 font-medium tracking-wide mt-0.5 truncate px-4">{trackActual.artista}</p>
                        </div>

                        {/* Botón de Descarga Directa Completa */}
                        {canciones.length > 0 && trackActual.mp3Url && (
                            <div className="flex justify-center mb-5">
                                <a 
                                    href={trackActual.mp3Url} 
                                    download
                                    target="_blank" 
                                    rel="noreferrer"
                                    className="flex items-center gap-2 px-4 py-1.5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 rounded-full text-xs text-neutral-300 font-medium transition shadow-md"
                                >
                                    <DownloadIcon />
                                    <span>Descargar MP3 Original</span>
                                </a>
                            </div>
                        )}

                        {/* Barra de Progreso Deslizable */}
                        <div className="mb-6">
                            <input 
                                type="range" 
                                min="0" 
                                max={duration || 0} 
                                value={progress} 
                                onChange={cambiarProgreso}
                                className="w-full h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer text-cyan-400"
                            />
                            <div className="flex justify-between text-xs text-neutral-400 mt-2 font-mono">
                                <span>{Math.floor(progress/60)}:{( "0" + Math.floor(progress%60) ).slice(-2)}</span>
                                <span>{duration ? `${Math.floor(duration/60)}:${("0"+Math.floor(duration%60)).slice(-2)}` : "0:00"}</span>
                            </div>
                        </div>

                        {/* Mandos Principales */}
                        <div className="flex justify-center items-center gap-6 mb-6">
                            <button onClick={anteriorCancion} className="text-cyan-400 hover:text-cyan-300 p-2 transition">
                                <SkipBackIcon />
                            </button>
                            <button onClick={alternarReproduccion} className="w-14 h-14 bg-cyan-500 text-black rounded-full flex items-center justify-center neon-glow-btn transition">
                                {isPlaying ? <PauseIcon /> : <PlayIcon />}
                            </button>
                            <button onClick={siguienteCancion} className="text-cyan-400 hover:text-cyan-300 p-2 transition">
                                <SkipForwardIcon />
                            </button>
                        </div>

                        {/* Lista Pública Vinculada a Firebase */}
                        <div className="mt-4 border-t border-neutral-800/60 pt-4">
                            <h4 className="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-2">Playlist en la Nube ({canciones.length})</h4>
                            <div className="max-h-40 overflow-y-auto custom-scrollbar space-y-1 pr-1">
                                {canciones.length === 0 ? (
                                    <p className="text-xs text-neutral-500 text-center py-4">No hay canciones inyectadas aún.</p>
                                ) : (
                                    canciones.map((can, index) => (
                                        <div 
                                            key={can.id} 
                                            className={`flex justify-between items-center p-2 rounded text-xs cursor-pointer transition ${index === currentTrackIndex ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'hover:bg-white/5 text-neutral-300'}`}
                                            onClick={() => { setCurrentTrackIndex(index); setIsPlaying(true); }}
                                        >
                                            <div className="truncate flex-1 pr-2">
                                                <span className="font-bold">{can.titulo}</span> - {can.artista}
                                            </div>
                                            
                                            {/* El botón de eliminar solo aparece si ingresaste la clave "psicosis" */}
                                            {esAdmin && (
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); eliminarCancion(can.id); }}
                                                    className="text-red-400 hover:text-red-500 p-1"
                                                    title="Eliminar de Firebase"
                                                >
                                                    <TrashIcon />
                                                </button>
                                            )}
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
