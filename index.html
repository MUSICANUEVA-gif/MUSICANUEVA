            measurementId: "G-Q5T61C2MNE"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function App() { 
            const [isPlaying, setIsPlaying] = useState(false); 
            const [progress, setProgress] = useState(0); 
            const [duration, setDuration] = useState(0); 
            const [volume, setVolume] = useState(0.8);
            const [isMuted, setIsMuted] = useState(false);
            const [panelAbierto, setPanelAbierto] = useState(false);
            const [canciones, setCanciones] = useState([]);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);

            // Campos de formulario para inyectar links
            const [nuevoTitulo, setNuevoTitulo] = useState("");
            const [nuevoArtista, setNuevoArtista] = useState("");
            const [nuevoMp3Url, setNuevoMp3Url] = useState("");
            const [nuevaPortadaUrl, setNuevaPortadaUrl] = useState("");

            const audioRef = useRef(null);

            // Sincronizar canciones desde Firebase Realtime Database
            useEffect(() => {
                const cancionesRef = db.ref('canciones');
                cancionesRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const listaCargada = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setCanciones(listaCargada);
                    } else {
                        setCanciones([]);
                    }
                });
                return () => cancionesRef.off();
            }, []);

            // Control de reproducción automática
            useEffect(() => {
                if (audioRef.current) {
                    if (isPlaying && canciones.length > 0) {
                        audioRef.current.play().catch(() => setIsPlaying(false));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, currentTrackIndex, canciones]);

            const actualizarProgreso = () => {
                if (audioRef.current) setProgress(audioRef.current.currentTime);
            };

            const metadataCargada = () => {
                if (audioRef.current) setDuration(audioRef.current.duration);
            };

            const cambiarProgreso = (e) => {
                const nuevoTiempo = parseFloat(e.target.value);
                if (audioRef.current) {
                    audioRef.current.currentTime = nuevoTiempo;
                    setProgress(nuevoTiempo);
                }
            };

            const guardarEnNube = (e) => {
                e.preventDefault();
                if (!nuevoTitulo || !nuevoMp3Url) return alert("Ingresa un título y un enlace MP3 válido.");

                const trackInfo = {
                    titulo: nuevoTitulo,
                    artista: nuevoArtista || "Artista Desconocido",
                    url: nuevoMp3Url,
                    portada: nuevaPortadaUrl || "https://unsplash.com"
                };

                db.ref('canciones').push(trackInfo);

                setNuevoTitulo("");
                setNuevoArtista("");
                setNuevoMp3Url("");
                setNuevaPortadaUrl("");
                setPanelAbierto(false);
            };

            const borrarDeNube = (id) => {
                if (confirm("¿Quieres eliminar esta canción de la lista global?")) {
                    db.ref(`canciones/${id}`).remove();
                }
            };

            const trackActual = canciones[currentTrackIndex] || {
                titulo: "Sin Canciones",
                artista: "Usa el Panel Creador",
