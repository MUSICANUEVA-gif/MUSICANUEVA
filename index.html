
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psicosis Music FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

html,body{
width:100%;
min-height:100%;
overflow-y:auto;
overflow-x:hidden;
}

body{
background:
radial-gradient(circle at top,#17002f,#050010 60%);
display:flex;
justify-content:center;
padding:40px 15px;
color:white;
}

.bg{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden;
}

.circle{
position:absolute;
border-radius:50%;
filter:blur(100px);
opacity:.3;
}

.circle:nth-child(1){
width:350px;
height:350px;
background:#00d9ff;
top:-100px;
left:-100px;
}

.circle:nth-child(2){
width:350px;
height:350px;
background:#8a2cff;
bottom:-100px;
right:-100px;
}

.player{
width:100%;
max-width:430px;
background:rgba(5,0,25,.88);
border-radius:35px;
padding:25px;
border:1px solid rgba(0,217,255,.2);
backdrop-filter:blur(15px);
box-shadow:
0 0 25px rgba(0,217,255,.25),
0 0 60px rgba(138,44,255,.15);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
gap:10px;
}

.logo{
font-size:1.7rem;
font-weight:700;
color:#00d9ff;
cursor:pointer;
text-shadow:0 0 15px #00d9ff;
}

.injector-btn{
padding:10px 15px;
border-radius:25px;
background:transparent;
border:1px solid #ff49ff;
color:#ff80ff;
cursor:pointer;
}

.search{
width:100%;
padding:14px;
border:none;
border-radius:15px;
background:#13002b;
color:white;
margin-bottom:25px;
outline:none;
}

.cover-box{
display:flex;
justify-content:center;
}

.cover{
width:240px;
height:240px;
border-radius:50%;
overflow:hidden;
border:5px solid #00d9ff;
box-shadow:
0 0 25px #00d9ff,
0 0 50px #8a2cff;
animation:spin 18s linear infinite;
}

.cover.pause{
animation-play-state:paused;
}

.cover img{
width:100%;
height:100%;
object-fit:cover;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

.info{
text-align:center;
margin-top:25px;
}

.info h2{
font-size:2rem;
margin-bottom:10px;
}

.info p{
color:#ff7cff;
}

.download{
display:block;
width:fit-content;
margin:20px auto;
padding:14px 20px;
border-radius:30px;
background:#111;
border:1px solid #555;
color:white;
text-decoration:none;
}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:25px;
margin-top:20px;
}

.play{
width:80px;
height:80px;
border-radius:50%;
border:none;
background:#00d9ff;
font-size:2rem;
cursor:pointer;
box-shadow:0 0 25px #00d9ff;
}

.ctrl{
font-size:2rem;
color:#00d9ff;
cursor:pointer;
}

.playlist{
margin-top:25px;
border-top:1px solid rgba(255,255,255,.1);
padding-top:20px;
max-height:250px;
overflow:auto;
}

.song{
padding:14px;
border-radius:14px;
background:#081d42;
margin-bottom:10px;
cursor:pointer;
transition:.3s;
}

.song:hover{
background:#113777;
}

.wave{
display:flex;
justify-content:center;
gap:5px;
margin-top:20px;
height:40px;
align-items:flex-end;
}

.bar{
width:5px;
background:#00d9ff;
border-radius:10px;
animation:bounce 1s infinite ease-in-out;
}

.bar:nth-child(1){height:15px;}
.bar:nth-child(2){height:25px;animation-delay:.1s;}
.bar:nth-child(3){height:35px;animation-delay:.2s;}
.bar:nth-child(4){height:20px;animation-delay:.3s;}
.bar:nth-child(5){height:28px;animation-delay:.4s;}

@keyframes bounce{
0%,100%{transform:scaleY(.5);}
50%{transform:scaleY(1.2);}
}

audio{
display:none;
}

#admin{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:380px;
background:#090015;
padding:25px;
border-radius:25px;
z-index:9999;
display:none;
box-shadow:0 0 40px #00d9ff;
}

#admin input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:12px;
background:#150028;
color:white;
}

#admin button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#00d9ff;
font-weight:bold;
cursor:pointer;
}

.hidden{
display:none;
}

@media(max-width:520px){

body{
padding:20px 10px;
}

.logo{
font-size:1.2rem;
}

.cover{
width:210px;
height:210px;
}

}

</style>
</head>

<body>

<div class="bg">
<div class="circle"></div>
<div class="circle"></div>
</div>

<div class="player">

<div class="top">
<div class="logo" id="logo">PSICOSIS MUSIC</div>

<button class="injector-btn" id="openInjector">
Modo Inyector
</button>
</div>

<input class="search" id="search" placeholder="🔍 Buscar canción o artista">

<div class="cover-box">
<div class="cover pause" id="coverSpin">
<img id="cover" src="https://picsum.photos/500">
</div>
</div>

<div class="info">
<h2 id="title">Psicosis Music</h2>
<p id="artist">Archive.org</p>
</div>

<a class="download" id="downloadBtn" href="#" target="_blank">
⬇ Descargar MP3 Original
</a>

<div class="wave">
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
</div>

<div class="controls">
<div class="ctrl">⏮</div>
<button class="play" id="playBtn">▶</button>
<div class="ctrl">⏭</div>
</div>

<div class="playlist">
<h3>PLAYLIST EN LA NUBE</h3>
<div id="songs"></div>
</div>

</div>

<audio id="audio"></audio>

<div id="admin">

<h2>Administrador</h2>

<div id="loginBox">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="injectorBox" class="hidden">
<input id="songTitle" placeholder="Título">
<input id="songArtist" placeholder="Artista">
<input id="songCover" placeholder="URL portada">
<input id="songAudio" placeholder="URL MP3">

<button onclick="saveSong()">Guardar Canción</button>
</div>

<button onclick="closeAdmin()">Cerrar</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
authDomain: "psicosismusic-2b04a.firebaseapp.com",
databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com",
projectId: "psicosismusic-2b04a",
storageBucket: "psicosismusic-2b04a.firebasestorage.app",
messagingSenderId: "233441166744",
appId: "1:233441166744:web:6757b5fb8d4fd1803697ed"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const songsRef = ref(db,"songs");

const songsBox = document.getElementById("songs");

const audio = document.getElementById("audio");

const title = document.getElementById("title");

const artist = document.getElementById("artist");

const cover = document.getElementById("cover");

const coverSpin = document.getElementById("coverSpin");

const downloadBtn = document.getElementById("downloadBtn");

let allSongs = [];

onValue(songsRef,(snapshot)=>{

songsBox.innerHTML = "";
allSongs = [];

snapshot.forEach((child)=>{

const song = child.val();

allSongs.push(song);

renderSong(song);

});

if(allSongs.length>0){

playSong(allSongs[0]);

}

});

function renderSong(song){

const div = document.createElement("div");

div.className = "song";

div.innerHTML = `
<b>${song.title}</b><br>
<small>${song.artist}</small>
`;

div.onclick = ()=> playSong(song);

songsBox.appendChild(div);

}

function playSong(song){

audio.src = song.audio;

title.innerText = song.title;

artist.innerText = song.artist;

cover.src = song.cover || "https://picsum.photos/500";

downloadBtn.href = song.audio;

audio.play();

document.getElementById("playBtn").innerText = "⏸";

coverSpin.classList.remove("pause");

}

document.getElementById("playBtn").onclick = ()=>{

if(audio.paused){

audio.play();

document.getElementById("playBtn").innerText = "⏸";

coverSpin.classList.remove("pause");

}else{

audio.pause();

document.getElementById("playBtn").innerText = "▶";

coverSpin.classList.add("pause");

}

};

document.getElementById("search").addEventListener("input",(e)=>{

const value = e.target.value.toLowerCase();

songsBox.innerHTML = "";

allSongs
.filter(song =>
(song.title || "").toLowerCase().includes(value) ||
(song.artist || "").toLowerCase().includes(value)
)
.forEach(renderSong);

});

document.getElementById("openInjector").onclick = ()=>{

document.getElementById("admin").style.display = "block";

};

window.closeAdmin = ()=>{

document.getElementById("admin").style.display = "none";

};

window.login = ()=>{

const u = document.getElementById("user").value;

const p = document.getElementById("pass").value;

if(u === "admin" && p === "psicosis123"){

document.getElementById("injectorBox").classList.remove("hidden");

alert("Administrador conectado");

}else{

alert("Datos incorrectos");

}

};

window.saveSong = async ()=>{

const song = {

title: document.getElementById("songTitle").value,
artist: document.getElementById("songArtist").value,
cover: document.getElementById("songCover").value,
audio: document.getElementById("songAudio").value

};

await push(songsRef,song);

alert("Canción guardada");

};

</script>

</body>
</html>
