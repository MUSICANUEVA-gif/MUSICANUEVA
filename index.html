<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSICA NUEVA - DJ PSICOSIS</title>
    <style>
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('fondo.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            background-color: #000; color: #fff; font-family: sans-serif; 
            margin: 0; padding: 20px; display: flex; justify-content: center; 
            flex-wrap: wrap; align-content: flex-start; gap: 20px; min-height: 100vh; 
        }
        .header-principal { width: 100%; text-align: center; margin-bottom: 10px; }
        .header-principal h1 { color: #00f7ff; text-shadow: 0 0 10px #00f7ff; font-size: 2rem; text-transform: uppercase; margin-bottom: 5px; }
        .header-principal h2 { color: #00f7ff; text-shadow: 0 0 10px #00f7ff; font-size: 1.5rem; text-transform: uppercase; margin-top: 0; letter-spacing: 2px; }
        
        .contenedor-buscador { width: 100%; display: flex; justify-content: center; margin-bottom: 30px; }
        #buscador { width: 90%; max-width: 400px; padding: 12px 20px; border-radius: 25px; border: 2px solid #00f7ff; background: rgba(0, 0, 0, 0.6); color: white; font-size: 1rem; outline: none; text-align: center; box-shadow: 0 0 10px rgba(0, 247, 255, 0.2); }
        
        .tarjeta { 
            background: rgba(0, 0, 0, 0.85); border: 2px solid #00f7ff; border-radius: 12px; 
            width: 100%; max-width: 280px; padding: 15px 15px 0px 15px; text-align: center; 
            box-shadow: 0 0 15px rgba(0, 247, 255, 0.4); overflow: hidden; backdrop-filter: blur(5px);
        }
        .hidden { display: none; }
        .cubrir { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; margin-bottom: 15px; display: block; }
        h3 { color: #fff; margin-bottom: 15px; font-size: 1.1em; height: 1.2em; overflow: hidden; text-transform: uppercase; }
        audio { width: 100%; height: 35px; margin-bottom: 15px; filter: invert(1); }
        .boton-de-descarga { 
            display: block; background: #00f7ff; color: #000; padding: 18px; 
            text-decoration: none; font-weight: bold; text-transform: uppercase; 
            font-size: 0.9em; margin: 0 -15px; transition: background 0.3s;
        }
        .boton-de-descarga:hover { background: #fff; }
    </style>
</head>
<body>

    <div class="header-principal">
        <h1>MUSICA NUEVA</h1>
        <h2>DJ PSICOSIS</h2>
    </div>

    <div class="contenedor-buscador">
        <input type="text" id="buscador" placeholder="Buscar canción o artista...">
    </div>

    <div id="contenedor-musica" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%;">
        </div>

    <script>
        // === LISTA DE CANCIONES (Agrega el nombre exacto de tus archivos aquí) ===
        const canciones = [
            "JAAZI L - LA VIDA E' 1 SOLA (Visualizador Oficial) MISIÓN.mp3",
            "Papa Jeison - Malianteo.mp3",
            "Megadivo Produce - Shorty.mp3",
            "Shorty.mp3",
            "Puyalo Pantera - Etel.mp3",
            "Pequeño Homie - A 200.mp3",
            "Ezzy R - PANTI Y COLALE 2.0.mp3"
        ];

        const lista = document.getElementById('contenedor-musica');

        canciones.forEach(nombreArchivo => {
            const titulo = nombreArchivo.replace('.mp3', '').replace(/-/g, ' ').replace(/_/g, ' ');
            lista.innerHTML += `
                <div class="tarjeta">
                    <img src="fondo.jpg" class="cubrir" alt="Portada">
                    <h3>${titulo}</h3>
                    <audio controls src="música/${nombreArchivo}"></audio>
                    <a href="música/${nombreArchivo}" class="boton-de-descarga" download="${nombreArchivo}">Descargar MP3</a>
                </div>
            `;
        });

        // Buscador funcional
        document.getElementById('buscador').addEventListener('keyup', function(e) {
            let texto = e.target.value.toLowerCase();
            document.querySelectorAll('.tarjeta').forEach(tarjeta => {
                let titulo = tarjeta.querySelector('h3').innerText.toLowerCase();
                tarjeta.classList.toggle('hidden', !titulo.includes(texto));
            });
        });

        // Auto-pausa (Solo suena una canción a la vez)
        document.addEventListener('play', function(e){
            var audios = document.getElementsByTagName('audio');
            for(var i = 0, len = audios.length; i < len;i++){
                if(audios[i] != e.target){
                    audios[i].pause();
                    audios[i].currentTime = 0;
                }
            }
        }, true);
    </script>
</body>
</html>
