<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psicosis Music PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#07000f;
color:white;
overflow-x:hidden;
}

/* FONDO */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.9)),
url('https://i.imgur.com/4AiXzf8.jpeg');
background-size:cover;
background-position:center;
z-index:-2;
}

/* APP */
.app{
display:flex;
min-height:100vh;
}

/* SIDEBAR */

.sidebar{
width:270px;
background:rgba(15,0,30,.85);
backdrop-filter:blur(20px);
padding:25px;
border-right:1px solid rgba(255,255,255,.08);
position:fixed;
height:100%;
}

.logo{
font-size:50px;
font-weight:700;
line-height:1;
margin-bottom:50px;
background:linear-gradient(45deg,#ff00ff,#7b2fff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.menu button{
width:100%;
margin-bottom:18px;
padding:18px;
border:none;
border-radius:18px;
background:rgba(255,255,255,.05);
color:white;
font-size:20px;
cursor:pointer;
transition:.3s;
}

.menu button:hover{
background:#8f00ff;
transform:scale(1.03);
}

/* MAIN */

.main{
margin-left:270px;
flex:1;
padding:30px;
}

/* HERO */

.hero{
height:320px;
border-radius:35px;
overflow:hidden;
position:relative;
margin-bottom:35px;
background:
linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.7)),
url('https://i.imgur.com/4AiXzf8.jpeg');
background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding:50px;
box-shadow:0 0 60px rgba(170,0,255,.3);
}

.hero h1{
font-size:80px;
font-weight:700;
text-shadow:0 0 30px #000;
}

.search{
margin-top:20px;
width:420px;
max-width:100%;
padding:18px;
border:none;
border-radius:50px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
color:white;
font-size:18px;
outline:none;
}

/* SONG GRID */

.song-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:25px;
}

.song-card{
background:rgba(255,255,255,.05);
border-radius:25px;
overflow:hidden;
transition:.3s;
cursor:pointer;
position:relative;
backdrop-filter:blur(10px);
}

.song-card:hover{
transform:translateY(-8px);
box-shadow:0 0 30px rgba(180,0,255,.4);
}

.song-card img{
width:100%;
height:230px;
object-fit:cover;
}

.song-info{
padding:18px;
}

.song-info h3{
font-size:24px;
margin-bottom:8px;
}

.song-info p{
opacity:.7;
}

.deleteBtn{
position:absolute;
top:12px;
right:12px;
background:#ff0048;
border:none;
color:white;
padding:10px 14px;
border-radius:12px;
cursor:pointer;
display:none;
font-weight:600;
}

/* PLAYER */

.player{
width:350px;
background:rgba(10,10,25,.88);
backdrop-filter:blur(25px);
padding:25px;
border-left:1px solid rgba(255,255,255,.08);
position:fixed;
right:0;
top:0;
height:100%;
}

.cover{
width:100%;
border-radius:30px;
margin-bottom:25px;
box-shadow:0 0 40px rgba(195,0,255,.4);
}

.player h2{
font-size:55px;
margin-bottom:10px;
}

.player p{
opacity:.7;
margin-bottom:25px;
}

.playBtn{
width:120px;
height:120px;
border:none;
border-radius:50%;
background:linear-gradient(45deg,#ff00ff,#6a00ff);
color:white;
font-size:45px;
cursor:pointer;
margin:20px auto;
display:block;
box-shadow:0 0 50px #ae00ff;
}

audio{
width:100%;
margin-top:25px;
}

.download{
margin-top:25px;
width:100%;
padding:20px;
border:none;
border-radius:20px;
background:linear-gradient(45deg,#6a00ff,#ff00ff);
color:white;
font-size:24px;
font-weight:700;
cursor:pointer;
}

.adminTag{
position:absolute;
top:15px;
right:20px;
background:#9f2dff;
padding:10px 18px;
border-radius:30px;
font-weight:700;
display:none;
}

/* ADMIN PANEL */

.adminPanel{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:450px;
background:#12001f;
padding:35px;
border-radius:30px;
z-index:99999;
display:none;
box-shadow:0 0 60px rgba(255,0,255,.5);
}

.adminPanel input{
width:100%;
padding:16px;
margin-bottom:15px;
border:none;
border-radius:14px;
background:#1c082d;
color:white;
font-size:16px;
}

.adminPanel button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#8f00ff;
color:white;
font-size:18px;
font-weight:700;
margin-top:10px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
display:none;
}

.main{
margin-left:0;
padding:15px;
}

.player{
position:relative;
width:100%;
height:auto;
margin-top:30px;
border-radius:30px;
}

.app{
flex-direction:column;
}

.hero{
height:260px;
padding:25px;
}

.hero h1{
font-size:50px;
}

.song-grid{
grid-template-columns:repeat(2,1fr);
}

}

</style>
</head>
<body>

<div class="app">

<div class="sidebar">

<div class="logo" id="logo">
PSICOSIS<br>MUSIC
</div>

<div class="menu">
<button>🏠 Inicio</button>
<button>🔥 Tendencias</button>
<button>🎵 Playlist</button>
<button>❤️ Favoritos</button>
<button>⬇ Descargas</button>
</div>

</div>

<div class="main">

<div class="hero">
<div>
<h1>Psicosis Music</h1>
<input class="search" id="search" placeholder="Buscar canción o artista">
</div>
</div>

<div class="song-grid" id="songs"></div>

</div>

<div class="player">

<div class="adminTag" id="adminTag">ADMIN</div>

<img id="cover" class="cover" src="https://i.imgur.com/4AiXzf8.jpeg">

<h2 id="title">Selecciona</h2>
<p id="artist">Psicosis Music</p>

<button class="playBtn" id="playBtn">▶</button>

<audio id="audio" controls></audio>

<button class="download" id="downloadBtn">
⬇ Descargar MP3
</button>

</div>

</div>

<!-- ADMIN -->

<div class="adminPanel" id="adminPanel">

<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">

<button onclick="login()">ENTRAR</button>

<hr style="margin:20px 0;border-color:#333;">

<input id="songUrl" placeholder="URL MP3">
<input id="coverUrl" placeholder="URL COVER">

<div id="manualMeta" style="display:none;">

<input id="manualTitle" placeholder="Título">
<input id="manualArtist" placeholder="Artista">

</div>

<button onclick="injectSong()">INYECTAR CANCIÓN</button>

<button onclick="closePanel()">CERRAR</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue,
remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
authDomain: "psicosismusic-2b04a.firebaseapp.com",
databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com",
projectId: "psicosismusic-2b04a",
storageBucket: "psicosismusic-2b04a.appspot.com",
messagingSenderId: "233441166744",
appId: "1:233441166744:web:6757b5fb8d4fd1803697ed"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let isAdmin=false;

const songsDiv=document.getElementById("songs");

const audio=document.getElementById("audio");
const title=document.getElementById("title");
const artist=document.getElementById("artist");
const cover=document.getElementById("cover");
const playBtn=document.getElementById("playBtn");

let currentSong=null;

/* ADMIN OPEN */

let clicks=0;

document.getElementById("logo").addEventListener("click",()=>{

clicks++;

if(clicks>=3){
document.getElementById("adminPanel").style.display="block";
clicks=0;
}

setTimeout(()=>clicks=0,1000);

});

/* LOGIN */

window.login=function(){

const u=document.getElementById("user").value;
const p=document.getElementById("pass").value;

if(u==="admin" && p==="admin123"){

isAdmin=true;

document.getElementById("adminTag").style.display="block";

alert("ADMIN ACTIVADO");

}else{
alert("Datos incorrectos");
}

}

/* CLOSE */

window.closePanel=function(){
document.getElementById("adminPanel").style.display="none";
}

/* PLAY */

playBtn.onclick=()=>{

if(audio.paused){
audio.play();
playBtn.innerHTML="⏸";
}else{
audio.pause();
playBtn.innerHTML="▶";
}

}

/* DOWNLOAD */

document.getElementById("downloadBtn").onclick=()=>{

if(!currentSong)return;

const a=document.createElement("a");
a.href=currentSong.url;
a.download=currentSong.title+".mp3";
document.body.appendChild(a);
a.click();
a.remove();

}

/* LOAD SONGS */

onValue(ref(db,"songs"),snapshot=>{

songsDiv.innerHTML="";

snapshot.forEach(item=>{

const song=item.val();
const key=item.key;

const div=document.createElement("div");
div.className="song-card";

div.innerHTML=`

${isAdmin ? `<button class="deleteBtn">X</button>` : ""}

<img src="${song.cover}">

<div class="song-info">
<h3>${song.title}</h3>
<p>${song.artist}</p>
</div>

`;

div.onclick=()=>{

currentSong=song;

audio.src=song.url;

title.innerText=song.title;
artist.innerText=song.artist;
cover.src=song.cover;

audio.play();

playBtn.innerHTML="⏸";

}

/* DELETE */

if(isAdmin){

div.querySelector(".deleteBtn").style.display="block";

div.querySelector(".deleteBtn").onclick=(e)=>{

e.stopPropagation();

if(confirm("Eliminar canción?")){

remove(ref(db,"songs/"+key));

}

}

}

songsDiv.appendChild(div);

});

});

/* SEARCH */

document.getElementById("search").addEventListener("input",e=>{

const value=e.target.value.toLowerCase();

document.querySelectorAll(".song-card").forEach(card=>{

card.style.display=
card.innerText.toLowerCase().includes(value)
? "block"
: "none";

});

});

/* INJECT */

window.injectSong=async function(){

const url=document.getElementById("songUrl").value;
const coverUrl=document.getElementById("coverUrl").value;

if(!url || !coverUrl){
alert("Faltan datos");
return;
}

/* AUTO META */

let autoTitle="Nueva Canción";
let autoArtist="Psicosis";

try{

const filename=url.split("/").pop();

autoTitle=decodeURIComponent(filename.replace(".mp3",""));

autoArtist="Artista Desconocido";

}catch(e){

document.getElementById("manualMeta").style.display="block";

return;

}

if(autoTitle===""){

document.getElementById("manualMeta").style.display="block";

return;

}

push(ref(db,"songs"),{

title:autoTitle,
artist:autoArtist,
url:url,
cover:coverUrl

});

alert("Canción agregada");

}

/* AUDIO END */

audio.onended=()=>{
playBtn.innerHTML="▶";
}

</script>

</body>
</html>
