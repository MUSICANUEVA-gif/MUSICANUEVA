
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psicosis Music</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
background:#070010;
color:#fff;
overflow-x:hidden;
min-height:100vh;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#9b2dff55,transparent 35%),
radial-gradient(circle at bottom right,#00e5ff33,transparent 35%),
linear-gradient(to bottom,#050510,#0b0018);
z-index:-2;
}

.wrapper{
display:grid;
grid-template-columns:260px 1fr 340px;
gap:20px;
padding:20px;
min-height:100vh;
}

.sidebar,.player,.main-card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:30px;
}

.sidebar{
padding:25px;
}

.logo{
font-size:2.2rem;
font-weight:700;
cursor:pointer;
margin-bottom:30px;
}

.logo span{color:#b44dff}

.menu div{
padding:15px;
margin-bottom:12px;
background:rgba(255,255,255,.05);
border-radius:16px;
}

.main-card{
padding:20px;
overflow:hidden;
}

.hero{
height:240px;
border-radius:30px;
padding:30px;
display:flex;
flex-direction:column;
justify-content:end;
background:
linear-gradient(to right,#000000aa,#00000055),
url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200&auto=format&fit=crop');
background-size:cover;
background-position:center;
margin-bottom:25px;
}

.hero h1{
font-size:4rem;
font-weight:700;
}

.search{
margin-top:15px;
padding:15px;
border:none;
border-radius:18px;
background:rgba(255,255,255,.12);
color:white;
outline:none;
max-width:350px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
gap:20px;
}

.song{
background:rgba(255,255,255,.05);
border-radius:25px;
overflow:hidden;
cursor:pointer;
transition:.3s;
}

.song:hover{
transform:translateY(-5px);
box-shadow:0 0 25px #8a2cff55;
}

.song img{
width:100%;
height:190px;
object-fit:cover;
}

.song-info{
padding:15px;
}

.song-info h3{
font-size:1rem;
margin-bottom:5px;
}

.song-info p{
opacity:.7;
font-size:.9rem;
}

.player{
padding:25px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.player img{
width:240px;
height:240px;
object-fit:cover;
border-radius:28px;
margin-bottom:20px;
box-shadow:0 0 35px #8a2cff66;
}

.player h2{
font-size:2rem;
text-align:center;
}

.player p{
opacity:.7;
margin:10px 0 20px;
}

.controls{
display:flex;
gap:20px;
align-items:center;
margin:20px 0;
}

.play{
width:85px;
height:85px;
border-radius:50%;
border:none;
font-size:2rem;
background:#9b2dff;
color:white;
cursor:pointer;
box-shadow:0 0 25px #9b2dff;
}

.download{
display:block;
width:100%;
padding:16px;
border-radius:20px;
background:linear-gradient(to right,#7a00ff,#bf4dff);
color:white;
text-decoration:none;
text-align:center;
font-weight:700;
margin-top:20px;
}

audio{
width:100%;
margin-top:15px;
}

#adminPanel{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:95%;
max-width:430px;
background:#0d0618;
border:1px solid #8a2cff55;
padding:25px;
border-radius:30px;
z-index:9999;
display:none;
backdrop-filter:blur(25px);
box-shadow:0 0 50px #8a2cff55;
}

#adminPanel h2{
margin-bottom:20px;
text-align:center;
}

#adminPanel input{
width:100%;
padding:14px;
margin-bottom:14px;
border:none;
border-radius:14px;
background:#1a102b;
color:white;
outline:none;
}

#adminPanel button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#8a2cff;
color:white;
font-weight:700;
cursor:pointer;
margin-top:10px;
}

.hidden{display:none}

@media(max-width:1100px){

.wrapper{
grid-template-columns:1fr;
}

.player{
order:-1;
}

}
</style>
</head>

<body>

<div class="bg"></div>

<div class="wrapper">

<div class="sidebar">

<div class="logo" id="logo">
PSICOSIS <span>MUSIC</span>
</div>

<div class="menu">
<div>🏠 Inicio</div>
<div>🔥 Tendencias</div>
<div>🎵 Playlist</div>
<div>❤️ Favoritos</div>
<div>⬇ Descargas</div>
</div>

</div>

<div class="main-card">

<div class="hero">
<h1>Psicosis Music</h1>
<input class="search" id="search" placeholder="Buscar canción o artista">
</div>

<div class="grid" id="songs"></div>

</div>

<div class="player">

<img id="cover" src="https://picsum.photos/500">

<h2 id="title">Sin canción</h2>

<p id="artist">Esperando reproducción...</p>

<div class="controls">
<button class="play" id="playBtn">▶</button>
</div>

<audio id="audio" controls></audio>

<a href="#" class="download" id="downloadBtn">
⬇ Descargar MP3
</a>

</div>

</div>

<div id="adminPanel">

<h2>INYECTOR PSICOSIS</h2>

<div id="loginBox">

<input type="text" id="user" placeholder="Usuario">
<input type="password" id="pass" placeholder="Contraseña">

<button onclick="login()">
Entrar
</button>

</div>

<div id="injectorBox" class="hidden">

<input type="text" id="mp3Url" placeholder="URL MP3 archive.org">

<input type="text" id="coverUrl" placeholder="URL portada archive.org">

<button onclick="injectSong()">
INYECTAR Y GUARDAR
</button>

</div>

<button onclick="closePanel()">
Cerrar
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
authDomain: "psicosismusic-2b04a.firebaseapp.com",
databaseURL: "https://psicosismusic-2b04a-default-rtdb.firebaseio.com",
projectId: "psicosismusic-2b04a",
storageBucket: "psicosismusic-2b04a.firebasestorage.app",
messagingSenderId: "233441166744",
appId: "1:233441166744:web:6757b5fb8d4fd1803697ed",
measurementId: "G-Q5T61C2MNE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const songsDiv = document.getElementById("songs");

const audio = document.getElementById("audio");

const cover = document.getElementById("cover");

const title = document.getElementById("title");

const artist = document.getElementById("artist");

const playBtn = document.getElementById("playBtn");

const downloadBtn = document.getElementById("downloadBtn");

let currentSong = null;

function renderSongs(data){

songsDiv.innerHTML = "";

Object.entries(data || {}).reverse().forEach(([id,song])=>{

const div = document.createElement("div");

div.className = "song";

div.innerHTML = `
<img src="${song.cover}">
<div class="song-info">
<h3>${song.title}</h3>
<p>${song.artist}</p>
</div>
`;

div.onclick = ()=>playSong(song);

songsDiv.appendChild(div);

});

}

function playSong(song){

currentSong = song;

audio.src = song.mp3;

cover.src = song.cover;

title.innerText = song.title;

artist.innerText = song.artist;

audio.play();

playBtn.innerText = "⏸";

}

playBtn.onclick = ()=>{

if(audio.paused){

audio.play();

playBtn.innerText = "⏸";

}else{

audio.pause();

playBtn.innerText = "▶";

}

};

downloadBtn.onclick = async(e)=>{

e.preventDefault();

if(!currentSong) return;

try{

const response = await fetch(currentSong.mp3);

const blob = await response.blob();

const url = URL.createObjectURL(blob);

const a = document.createElement("a");

a.href = url;

a.download = currentSong.title + ".mp3";

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

}catch(err){

alert("Error descargando archivo");

}

};

onValue(ref(db,"songs"),(snapshot)=>{

renderSongs(snapshot.val());

});

window.login = function(){

const user = document.getElementById("user").value;

const pass = document.getElementById("pass").value;

if(user === "admin" && pass === "psicosis123"){

document.getElementById("injectorBox").classList.remove("hidden");

alert("Modo inyector activado");

}else{

alert("Datos incorrectos");

}

};

window.injectSong = async function(){

const mp3 = document.getElementById("mp3Url").value.trim();

const coverUrl = document.getElementById("coverUrl").value.trim();

if(!mp3 || !coverUrl){

alert("Completa ambos campos");

return;

}

let songData = {
title:"Canción desconocida",
artist:"Artista desconocido",
mp3:mp3,
cover:coverUrl
};

new window.jsmediatags.Reader(mp3)
.read({
onSuccess:function(tag){

songData.title = tag.tags.title || "Sin título";
songData.artist = tag.tags.artist || "Artista desconocido";

push(ref(db,"songs"),songData);

alert("Canción guardada correctamente");

},
onError:function(){

push(ref(db,"songs"),songData);

alert("Guardado sin metadata ID3");

}
});

};

window.closePanel = function(){

document.getElementById("adminPanel").style.display = "none";

};

let clicks = 0;

document.getElementById("logo").addEventListener("click",()=>{

clicks++;

if(clicks >= 3){

document.getElementById("adminPanel").style.display = "block";

clicks = 0;

}

setTimeout(()=>{

clicks = 0;

},1500);

});

</script>

</body>
</html>
