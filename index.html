<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSICOSIS MUSIC</title>

<style>
body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    text-align:center;
    padding:20px;
    background:#111;
    box-shadow:0 0 20px #00d4ff;
}

.logo{
    color:#00d4ff;
    font-size:40px;
    text-shadow:0 0 20px #00d4ff;
}

#searchInput{
    width:80%;
    max-width:600px;
    padding:12px;
    border:none;
    border-radius:10px;
}

main{
    padding-bottom:140px;
}

#songsContainer{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.songCard{
    background:#111;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 15px #00d4ff;
}

.songCard img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.songInfo{
    padding:15px;
}

#playerSection{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111;
    padding:15px;
    display:flex;
    align-items:center;
    gap:15px;
    border-top:2px solid #00d4ff;
    box-shadow:0 0 20px #00d4ff;
    z-index:999;
}

#playerCover{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
}

#playerInfo{
    flex:1;
}

audio{
    width:350px;
}

#adminPanel{
    padding:20px;
}
</style>
</head>
<body>

<header class="header">
    <h1 class="logo">PSICOSIS MUSIC</h1>
    <input type="text" id="searchInput" placeholder="Buscar canciones...">
</header>

<main>
    <section id="latestSongs">
        <h2>Últimas Canciones</h2>
        <div id="songsContainer"></div>
    </section>
</main>

<section id="playerSection">
    <img id="playerCover">
    <div id="playerInfo">
        <h3 id="playerTitle">Ninguna canción</h3>
        <p id="playerArtist"></p>
    </div>
    <audio id="audioPlayer" controls></audio>
</section>

<div id="adminPanel">
    <h2>Administrador</h2>
    <input id="archiveUrl" placeholder="https://archive.org/details/...">
    <button id="analyzeBtn">Analizar</button>
    <div id="preview"></div>
    <button id="saveBtn">Guardar</button>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue,
push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyAznXQHLb2b_c0BDIPteN2TPmY8WBmf0fw",
authDomain:"psicosismusic-2b04a.firebaseapp.com",
databaseURL:"https://psicosismusic-2b04a-default-rtdb.firebaseio.com",
projectId:"psicosismusic-2b04a",
storageBucket:"psicosismusic-2b04a.firebasestorage.app",
messagingSenderId:"233441166744",
appId:"1:233441166744:web:6757b5fb8d4fd1803697ed"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(
ref(db,"songs"),
(snapshot)=>{
const data = snapshot.val() || {};
renderSongs(data);
}
);

function renderSongs(data){

const container =
document.getElementById("songsContainer");

container.innerHTML="";

Object.values(data).forEach(song=>{

container.innerHTML += `
<div class="songCard">
<img src="${song.cover}">
<div class="songInfo">
<h3>${song.title}</h3>
<p>${song.artist}</p>
<button onclick="playSong('${song.audio}','${song.cover}','${song.title}','${song.artist}')">
▶ Reproducir
</button>
</div>
</div>`;

});
}

window.playSong = function(audio,cover,title,artist){

document.getElementById("audioPlayer").src = audio;
document.getElementById("playerCover").src = cover;
document.getElementById("playerTitle").textContent = title;
document.getElementById("playerArtist").textContent = artist;
document.getElementById("audioPlayer").play();

}

</script>

</body>
</html>
