<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psicosis Music PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#060010;
color:white;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.8)),
url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1600');
background-size:cover;
background-position:center;
z-index:-2;
}

body::after{
content:'';
position:fixed;
inset:0;
background:linear-gradient(90deg,#110022,#040012,#0d0222);
opacity:.88;
z-index:-1;
}

.container{
display:grid;
grid-template-columns:250px 1fr 340px;
gap:20px;
padding:20px;
min-height:100vh;
}

.sidebar{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border-radius:25px;
padding:30px 20px;
border:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:52px;
font-weight:700;
line-height:0.9;
background:linear-gradient(180deg,#ff66ff,#8a2eff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:40px;
}

.menu button{
width:100%;
padding:16px;
margin-bottom:15px;
border:none;
border-radius:18px;
background:rgba(255,255,255,.05);
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

.menu button:hover{
background:#8a2eff;
transform:scale(1.02);
}

.main{
display:flex;
flex-direction:column;
gap:20px;
}

.hero{
height:320px;
border-radius:35px;
overflow:hidden;
position:relative;
background:url('https://images.unsplash.com/photo-1501386761578-eac5c94b800a?q=80&w=1600');
background-size:cover;
background-position:center;
}

.hero::before{
content:'';
position:absolute;
inset:0;
background:linear-gradient(to right,rgba(0,0,0,.8),rgba(0,0,0,.2));
}

.hero-content{
position:absolute;
left:40px;
bottom:40px;
z-index:2;
}

.hero h1{
font-size:72px;
font-weight:700;
}

.search{
margin-top:20px;
width:350px;
padding:15px 20px;
border:none;
border-radius:30px;
background:rgba(255,255,255,.15);
color:white;
backdrop-filter:blur(20px);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

.card{
background:rgba(255,255,255,.05);
border-radius:25px;
overflow:hidden;
backdrop-filter:blur(20px);
transition:.3s;
cursor:pointer;
}

.card:hover{
transform:translateY(-5px) scale(1.02);
box-shadow:0 0 25px #8a2eff;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-info{
padding:15px;
}

.card h3{
font-size:24px;
}

.card p{
opacity:.8;
margin-top:5px;
}

.player{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border-radius:30px;
padding:25px;
display:flex;
flex-direction:column;
align-items:center;
border:1px solid rgba(255,255,255,.08);
}

.player img{
width:220px;
height:220px;
object-fit:cover;
border-radius:25px;
box-shadow:0 0 30px #8a2eff;
}

.player h2{
margin-top:20px;
font-size:48px;
}

.player p{
opacity:.8;
margin-bottom:20px;
}

.playBtn{
width:100px;
height:100px;
border-radius:50%;
border:none;
background:linear-gradient(180deg,#c83cff,#7a00ff);
color:white;
font-size:40px;
cursor:pointer;
box-shadow:0 0 30px #a200ff;
margin:20px 0;
}

.download{
padding:16px 30px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#9d00ff,#ff2fd1);
color:white;
font-size:20px;
cursor:pointer;
margin-top:20px;
}

audio{
width:100%;
margin-top:20px;
}

.injector{
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.injector-box{
width:450px;
background:#12001f;
padding:30px;
border-radius:30px;
box-shadow:0 0 30px #8a2eff;
}

.injector-box h2{
margin-bottom:20px;
text-align:center;
}

.injector-box input{
width:100%;
padding:16px;
margin-bottom:15px;
border:none;
border-radius:15px;
background:#1f0a35;
color:white;
}

.injector-box button{
width:100%;
padding:16px;
border:none;
border-radius:15px;
background:#8a2eff;
color:white;
font-size:18px;
cursor:pointer;
}

.adminBtn{
position:fixed;
top:15px;
right:15px;
padding:10px 20px;
border:none;
border-radius:20px;
background:#8a2eff;
color:white;
cursor:pointer;
z-index:99;
}

@media(max-width:1000px){
.container{
grid-template-columns:1fr;
}

.sidebar{
display:none;
}

.hero h1{
font-size:48px;
}

.player{
margin-bottom:50px;
}
}
</style>
</head>

<body>

<button class="adminBtn" onclick="openInjector()">ADMIN</button>

<div class="container">

<div class="sidebar">
<div class="logo">PSICOSIS<br>MUSIC</div>

<div class="menu">
<button>🏠 Inicio</button>
<button>🔥 Tendencias</button>
<button>🎵 Playlist</button>
<button>❤️ Favoritos</button>
<button>⬇ Descargas</button>
</div>
</div>

<div class="main">

<div class="hero">
<div class="hero-content">
<h1>Psicosis Music</h1>
<input class="search" placeholder="Buscar canción o artista">
</div>
</div>

<div class="grid" id="playlist"></div>

</div>

<div class="player">
<img id="cover" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1200">
<h2 id="title">Selecciona</h2>
<p id="artist">Psicosis Music</p>

<button class="playBtn" onclick="togglePlay()">▶</button>

<audio id="audio" controls></audio>

<button class="download" onclick="downloadSong()">⬇ Descargar MP3</button>
</div>

</div>

<div class="injector" id="injector">
<div class="injector-box">

<h2>INYECTOR PSICOSIS</h2>

<input type="text" id="songTitle" placeholder="Título">
<input type="text" id="songArtist" placeholder="Artista">
<input type="text" id="songUrl" placeholder="URL MP3">
<input type="text" id="coverUrl" placeholder="URL Carátula">

<button onclick="injectSong()">INYECTAR</button>

</div>
</div>

<script>

let currentSong='';

function openInjector(){
const pass=prompt("Contraseña admin");
if(pass==="admin123"){
document.getElementById("injector").style.display="flex";
}else{
alert("Acceso denegado");
}
}

function injectSong(){

const title=document.getElementById("songTitle").value;
const artist=document.getElementById("songArtist").value;
const url=document.getElementById("songUrl").value;
const cover=document.getElementById("coverUrl").value;

if(!title||!artist||!url||!cover){
alert("Completa todos los campos");
return;
}

const song={
title,
artist,
url,
cover
};

let songs=JSON.parse(localStorage.getItem("psicosisSongs"))||[];
songs.unshift(song);

localStorage.setItem("psicosisSongs",JSON.stringify(songs));

renderSongs();

document.getElementById("injector").style.display="none";

alert("Canción agregada");
}

function renderSongs(){

const playlist=document.getElementById("playlist");

playlist.innerHTML='';

let songs=JSON.parse(localStorage.getItem("psicosisSongs"))||[];

songs.forEach((song,index)=>{

playlist.innerHTML+=`
<div class="card" onclick="playSong(${index})">
<img src="${song.cover}">
<div class="card-info">
<h3>${song.title}</h3>
<p>${song.artist}</p>
</div>
</div>
`;

});

}

function playSong(index){

let songs=JSON.parse(localStorage.getItem("psicosisSongs"))||[];

const song=songs[index];

document.getElementById("cover").src=song.cover;
document.getElementById("title").innerText=song.title;
document.getElementById("artist").innerText=song.artist;

const audio=document.getElementById("audio");

audio.src=song.url;

audio.play();

currentSong=song.url;
}

function togglePlay(){
const audio=document.getElementById("audio");

if(audio.paused){
audio.play();
}else{
audio.pause();
}
}

function downloadSong(){

if(!currentSong){
alert("Selecciona una canción");
return;
}

const a=document.createElement("a");
a.href=currentSong;
a.download="PsicosisMusic.mp3";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
}

renderSongs();

</script>

</body>
</html>
