<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSICOSIS MUSIC</title>
<style>
:root{
--bg:#050505;
--cyan:#00d4ff;
--purple:#c000ff;
--pink:#ff0088;
--white:#ffffff;
}
body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--white);
}
header{
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}
.logo{
font-size:28px;
font-weight:bold;
color:var(--cyan);
}
#catalog{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
padding:20px;
}
.songCard{
background:#111;
padding:15px;
border-radius:12px;
}
#player{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
padding:15px;
}
</style>
</head>
<body>

<header>
<div class="logo">PSICOSIS MUSIC</div>
<input id="searchInput" placeholder="Buscar música...">
</header>

<section id="home">
<h2>Últimas canciones</h2>
</section>

<section id="catalog"></section>

<section id="player">
<img id="playerCover" width="60">
<h2 id="playerTitle">Sin reproducción</h2>
<audio id="audioPlayer" controls></audio>
</section>

<section id="loginPanel">
<input id="email" placeholder="Correo">
<input id="password" type="password" placeholder="Contraseña">
<button id="loginBtn">Ingresar</button>
</section>

<section id="adminPanel" style="display:none">
<h2>Panel Administrador</h2>
<input id="archiveUrl" placeholder="URL Archive.org">
<button id="analyzeBtn">Analizar</button>
<div id="preview"></div>
<button id="saveBtn">Guardar</button>
</section>

<script type="module">
console.log("PSICOSIS MUSIC cargado");
</script>

</body>
</html>
