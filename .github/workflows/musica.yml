name: Actualizar Musica desde Telegram

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pytelegrambotapi requests music-tag

      - name: Ejecutar script actualizador
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPO: "MUSICANUEVA-gif/MUSICANUEVA"
        run: |
          python -c '
          import telebot, requests, json, base64, music_tag, os
          
          TOKEN = os.environ["TELEGRAM_TOKEN"]
          REPO = os.environ["GITHUB_REPO"]
          GH_TOKEN = os.environ["GITHUB_TOKEN"]
          
          bot = telebot.TeleBot(TOKEN)
          
          def sube_gh(ruta, datos, msg):
              url = f"https://github.com{REPO}/contents/{ruta}"
              h = {"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github.v3+json"}
              res = requests.get(url, headers=h)
              sha = res.json().get("sha") if res.status_code == 200 else None
              data = {"message": msg, "content": base64.b64encode(datos).decode("utf-8")}
              if sha: data["sha"] = sha
              r = requests.put(url, headers=h, json=data)
              print(f"Subida {ruta}: {r.status_code}")

          try:
              updates = bot.get_updates(limit=50, allowed_updates=["channel_post"])
          except Exception as e:
              print(f"Error al conectar con Telegram: {e}")
              updates = []
          
          url_json = f"https://githubusercontent.com{REPO}/main/playlist.json"
          res_json = requests.get(url_json)
          playlist = res_json.json() if res_json.status_code == 200 else []
          
          urls_existentes = [s["audio_url"] for s in playlist]
          actualizado = False

          for u in updates:
              if not hasattr(u, "channel_post") or u.channel_post is None:
                  continue
              post = u.channel_post
              if post.audio:
                  fid = post.audio.file_id
                  uid = post.audio.file_unique_id
                  ruta_pista = f"tracks/{uid}.mp3"
                  url_final = f"https://github.io{ruta_pista}"
                  
                  if url_final not in urls_existentes:
                      try:
                          info = bot.get_file(fid)
                          f_bytes = bot.download_file(info.file_path)
                          
                          with open("t.mp3", "wb") as f: f.write(f_bytes)
                          
                          titulo = post.audio.title or "Pista Nueva"
                          artista = post.audio.performer or "Desconocido"
                          c_url = ""
                          
                          try:
                              m = music_tag.load_file("t.mp3")
                              if m["title"]: titulo = str(m["title"])
                              if m["artist"]: artista = str(m["artist"])
                              if m["artwork"]:
                                  c_name = f"covers/{uid}.jpg"
                                  sube_gh(c_name, m["artwork"].first.data, "Nueva portada")
                                  c_url = f"https://github.io{c_name}"
                          except: pass
                          
                          if os.path.exists("t.mp3"): os.remove("t.mp3")
                          
                          sube_gh(ruta_pista, f_bytes, f"Audio: {titulo}")
                          playlist.append({"title": titulo, "artist": artista, "audio_url": url_final, "cover_url": c_url})
                          urls_existentes.append(url_final)
                          actualizado = True
                      except Exception as ex:
                          print(f"Error procesando cancion: {ex}")
          
          if actualizado:
              sube_gh("playlist.json", json.dumps(playlist, indent=4).encode("utf-8"), "Playlist actualizada")
          else:
              print("No se encontraron canciones nuevas en los registros.")
          '
