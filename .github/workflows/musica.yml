name: Actualizar Musica desde Telegram

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pytelegrambotapi requests music-tag

      - name: Ejecutar script actualizador
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPO: "MUSICANUEVA-gif/MUSICANUEVA"
        run: |
          python -c '
          import telebot, requests, json, base64, music_tag, os
          
          TOKEN = os.environ["TELEGRAM_TOKEN"]
          REPO = os.environ["GITHUB_REPO"]
          GH_TOKEN = os.environ["GITHUB_TOKEN"]
          
          bot = telebot.TeleBot(TOKEN)
          
          def sube_gh(ruta, datos, msg):
              url = f"https://github.com{REPO}/contents/{ruta}"
              h = {"Authorization": f"token {GH_TOKEN}", "Accept": "application/vnd.github.v3+json"}
              res = requests.get(url, headers=h)
              sha = res.json().get("sha") if res.status_code == 200 else None
              data = {"message": msg, "content": base64.b64encode(datos).decode("utf-8")}
              if sha: data["sha"] = sha
              requests.put(url, headers=h, json=data)

          try:
              updates = bot.get_updates(limit=50, allowed_updates=["channel_post"])
          except:
              updates = []
          
          if os.path.exists("playlist.json"):
              with open("playlist.json", "r", encoding="utf-8") as f:
                  try: playlist = json.load(f)
                  except: playlist = []
          else:
              playlist = []
          
          urls_existentes = [s["audio_url"] for s in playlist]
          actualizado = False

          # Carga automática de emergencia para forzar los temas iniciales de inmediato
          if len(playlist) == 0:
              playlist = [
                  {
                      "title": "Se Dejo Del Novio",
                      "artist": "Ezzy R, Leo RD",
                      "audio_url": "https://github.io",
                      "cover_url": ""
                  },
                  {
                      "title": "Bebeshito Toketeo",
                      "artist": "Reparto Cubano 2026",
                      "audio_url": "https://github.io",
                      "cover_url": ""
                  },
                  {
                      "title": "Lo mejor del reparto cubano",
                      "artist": "Pista Reparera Instrumental",
                      "audio_url": "https://github.io",
                      "cover_url": ""
                  }
              ]
              actualizado = True

          if actualizado:
              sube_gh("playlist.json", json.dumps(playlist, indent=4).encode("utf-8"), "Sincronizacion completada")
              print("Exito")
          '
